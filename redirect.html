<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKDGMS | System Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media', // Auto-adapts to system light/dark mode
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0edff', 100: '#e1d9ff', 200: '#c7b8fe',
                            500: '#7c5cfc', 600: '#6c47ff', 700: '#5830f0',
                            800: '#431ec2', 900: '#231263', 950: '#0f0a1c',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 3s linear infinite',
                        'spin-reverse': 'spin 2s linear infinite reverse',
                    }
                }
            }
        }
    </script>
    <style>
        .progress-bar-fill {
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .brand-glow {
            box-shadow: 0 0 50px -5px rgba(108, 71, 255, 0.35);
        }
        .dark .brand-glow {
            box-shadow: 0 0 60px -5px rgba(124, 92, 252, 0.45);
        }
    </style>
</head>
<body class="bg-[#f4f5fa] dark:bg-[#0d0918] text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-center items-center p-6 antialiased font-sans select-none transition-colors duration-300">

    <!-- Centered Loader Screen Container -->
    <main class="w-full max-w-sm flex flex-col items-center justify-center my-auto">
        
        <!-- Centered Animated Circle with Image -->
        <div class="relative w-44 h-44 flex items-center justify-center mb-8">
            
            <!-- Ambient Glow -->
            <div class="absolute inset-0 rounded-full bg-brand-500/20 dark:bg-brand-600/30 blur-2xl animate-pulse-slow"></div>

            <!-- Outer Rotating Ring -->
            <div class="absolute inset-0 rounded-full border-2 border-transparent border-t-brand-600 border-r-brand-500/40 dark:border-t-brand-500 dark:border-r-brand-400/30 animate-spin-slow"></div>
            
            <!-- Inner Counter-Rotating Ring -->
            <div class="absolute inset-3 rounded-full border-2 border-transparent border-b-brand-500 border-l-brand-600/30 dark:border-b-brand-400 animate-spin-reverse"></div>

            <!-- Circle Badge containing kk.png -->
            <div class="w-28 h-28 rounded-full bg-white dark:bg-brand-950/90 border border-purple-100 dark:border-brand-800/80 shadow-xl brand-glow flex items-center justify-center relative z-10 backdrop-blur-md p-5 overflow-hidden">
                <img src="kk.png" alt="KKDGMS Logo" class="w-full h-full object-contain rounded-full" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/7595/7595183.png';">
            </div>

            <!-- Orbiting Particle -->
            <div class="absolute inset-0 animate-spin-slow">
                <div class="w-3 h-3 bg-brand-500 rounded-full shadow-lg shadow-brand-500 absolute -top-1.5 left-1/2 -translate-x-1/2"></div>
            </div>
        </div>

        <!-- Dynamic Loading Status & Progress Bar -->
        <div class="w-full text-center space-y-3">
            <h2 id="loading-status" class="text-sm font-bold text-slate-800 dark:text-slate-200 tracking-wide font-mono">
                Database...
            </h2>
            
            <div class="w-full bg-slate-200/80 dark:bg-brand-950 border border-brand-100 dark:border-brand-900 h-2.5 rounded-full overflow-hidden p-0.5 shadow-inner">
                <div id="progress-bar" class="bg-gradient-to-r from-brand-600 to-brand-500 h-full w-0 rounded-full progress-bar-fill shadow-sm"></div>
            </div>

            <div class="flex justify-between items-center text-[11px] font-mono font-semibold text-slate-400 dark:text-slate-500 px-1">
                <span>VERIFYING DATA</span>
                <span id="progress-text" class="text-brand-600 dark:text-brand-400 font-bold">0%</span>
            </div>
        </div>

    </main>

    <!-- Execution Script -->
    <script>
        const statusText = document.getElementById('loading-status');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');

        // Categories to sequence through
        const steps = [
            { percent: 25, message: "Database..." },
            { percent: 50, message: "Leave Record..." },
            { percent: 75, message: "Question Bank..." },
            { percent: 90, message: "Profile Status..." },
            { percent: 100, message: "Redirecting..." }
        ];

        let currentStep = 0;

        function runLoader() {
            if (currentStep < steps.length) {
                const step = steps[currentStep];
                progressBar.style.width = step.percent + "%";
                progressText.innerText = step.percent + "%";
                statusText.innerText = step.message;
                
                currentStep++;
                setTimeout(runLoader, 350 + Math.random() * 200);
            } else {
                // Determine target page URL or fallback to index.html
                const urlParams = new URLSearchParams(window.location.search);
                let target = urlParams.get('target');

                if (target) {
                    target = decodeURIComponent(target);
                    // Add 'loaded=true' flag so the destination page knows not to redirect back
                    const destination = new URL(target);
                    destination.searchParams.set('loaded', 'true');
                    window.location.replace(destination.toString());
                } else {
                    window.location.replace("index.html?loaded=true");
                }
            }
        }

        window.addEventListener('load', runLoader);
    </script>
</body>
</html>
