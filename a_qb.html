<!DOCTYPE html>

<body class="bg-portal-bg dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased min-h-screen p-4 md:p-8 flex flex-col items-center space-y-6">

    <!-- TOP CONTROL BAR -->

        <button type="button" onclick="toggleThemeSystem()" class="bg-white dark:bg-slate-900 text-slate-600 dark:text-indigo-400 border border-slate-200 dark:border-white/10 p-2.5 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800/80 shadow-xs transition-all duration-200">

    <!-- METRIC SUMMARY RIBBON -->

    <!-- MAIN ADMIN BULK INGEST ENGINE -->

        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-4 border-b border-slate-100 dark:border-white/5 gap-4">

                <div>

            </div>
            <button type="button" onclick="appendQuestionRow()" class="inline-flex items-center space-x-2 bg-indigo-50 dark:bg-indigo-950 hover:bg-indigo-100 dark:hover:bg-indigo-900/60 text-indigo-600 dark:text-indigo-400 font-semibold text-sm py-2.5 px-4 rounded-xl transition shadow-xs">
                <i data-lucide="plus" class="w-4 h-4"></i><span>Add Record Slot</span>
            </button>
        </div>

        <form id="bulk-form" class="space-y-6" onsubmit="event.preventDefault();">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 bg-slate-50 dark:bg-slate-950/40 p-4 rounded-2xl border border-slate-100 dark:border-white/5">
                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Target Subject Register</label>
                    <input type="text" id="global-subject" required class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition shadow-xs" placeholder="e.g., Physics">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Target Topic Index</label>
                    <input type="text" id="global-topic" required class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition shadow-xs" placeholder="e.g., Thermodynamics">
                </div>
            </div>
            
            <div id="bulk-container" class="space-y-4"></div>
            
            <div class="flex items-center justify-end pt-4 border-t border-slate-100 dark:border-white/5 space-x-3">
                <button type="button" onclick="submitBulkData('Draft')" class="w-40 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold text-xs uppercase tracking-wider py-3 rounded-xl transition"><i data-lucide="save" class="w-4 h-4 inline mr-1.5"></i> Force As DRAFT</button>
                <button type="button" onclick="submitBulkData('Published')" class="w-40 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs uppercase tracking-wider py-3 rounded-xl transition shadow-md shadow-indigo-600/10"><i data-lucide="shield-check" class="w-4 h-4 inline mr-1.5"></i> Force As PUBLISH</button>
            </div>
        </form>
    </div>

    <!-- REPOSITORY WORKFLOW REGISTER -->
    <div class="w-full max-w-7xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-white/5 rounded-2xl p-5 md:p-8 space-y-6 shadow-sm">
        <div class="flex flex-col lg:flex-row justify-between items-stretch lg:items-center border-b border-slate-100 dark:border-white/5 pb-4 gap-4">
            <div class="flex items-center justify-between lg:justify-start lg:space-x-4">
                <h2 class="text-base font-bold text-slate-800 dark:text-white flex items-center tracking-tight"><i data-lucide="database" class="w-5 h-5 mr-2 text-indigo-500"></i>Master Vault Records</h2>
            </div>
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                <input type="text" id="search-filter" oninput="loadData()" class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-slate-900 dark:text-white w-full sm:w-72 shadow-xs" placeholder="Scan records globally...">
                <button onclick="purgeEmptyRegisters()" class="text-xs text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/30 border border-rose-200 dark:border-rose-900/40 font-semibold uppercase tracking-wider px-4 py-2.5 rounded-xl transition-all shrink-0"><i data-lucide="trash-2" class="w-4 h-4 inline mr-1.5"></i> Cleanup Diagnostics</button>
            </div>
        </div>

        <div id="repository-container" class="space-y-6">
            <div class="text-center py-12 text-slate-400 font-medium text-sm tracking-wide">Parsing master storage records...</div>
        </div>
    </div>

    <!-- MODAL OVERRIDE PANEL -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm hidden items-start justify-center p-4 z-50 overflow-y-auto">
        <div class="w-full max-w-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-white/10 rounded-2xl p-6 md:p-8 my-8 space-y-5 shadow-2xl relative animate-in fade-in zoom-in-95 duration-200">
            <div class="flex justify-between items-center border-b border-slate-100 dark:border-white/5 pb-3">
                <h2 class="text-base font-bold text-indigo-600 dark:text-indigo-400 tracking-tight">Admin Vault Override</h2>
                <span id="modal-id-badge" class="font-mono text-xs font-semibold text-slate-500 bg-slate-100 dark:bg-slate-950 px-2.5 py-1 rounded-md border border-slate-200 dark:border-white/5">ID: —</span>
            </div>
            <input type="hidden" id="edit-id">
            <input type="hidden" id="edit-entry-type">
            
            <div class="space-y-5">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Marks Weightage</label>
                        <input type="number" id="edit-marks" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Difficulty</label>
                        <select id="edit-difficulty" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition">
                            <option value="Easy">Easy</option><option value="Medium">Medium</option><option value="Hard">Hard</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Status Flag</label>
                        <select id="edit-status" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition">
                            <option value="Draft">Draft</option><option value="Published">Published</option>
                        </select>
                    </div>
                </div>

                <!-- QA Fields Container -->
                <div id="edit-qa-container" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Question Statement</label>
                        <textarea id="edit-question" oninput="adjustTextAreaHeight(this)" class="auto-resize w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 leading-relaxed transition"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Answer Format</label>
                        <select id="edit-format" onchange="toggleModalAnswerFormat()" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 transition">
                            <option value="points">Points List</option>
                            <option value="passage">Passage Text</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Answer Payload</label>
                        <textarea id="edit-answer" oninput="adjustTextAreaHeight(this)" class="auto-resize w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 leading-relaxed transition"></textarea>
                    </div>
                </div>

                <!-- Drive Fields Container -->
                <div id="edit-drive-container" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Resource Title</label>
                        <input type="text" id="edit-title" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Resource Subtitle</label>
                        <input type="text" id="edit-subtitle" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Google Drive URL</label>
                        <input type="url" id="edit-drive-url" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 transition">
                    </div>
                </div>
            </div>

            <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100 dark:border-white/5">
                <button onclick="closeEditModal()" class="px-5 py-2.5 bg-slate-100 dark:bg-slate-800 text-xs font-semibold rounded-xl uppercase tracking-wider text-slate-700 dark:text-slate-300 hover:bg-slate-200 transition">Abort Changes</button>
                <button onclick="saveUpdatedQuestion()" class="px-5 py-2.5 bg-indigo-600 text-white text-xs font-semibold rounded-xl uppercase tracking-wider hover:bg-indigo-700 transition shadow-md shadow-indigo-600/10">Commit Data Changes</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://kymsjrxjfmloibcbages.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5bXNqcnhqZm1sb2liY2JhZ2VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTg5NzcsImV4cCI6MjA5NDU5NDk3N30.yXqibP86VDsJ0gW48cJ0yjixgYGpljesLsiqe93K4OA";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let rowCount = 0;
        let cachedData = [];

        document.addEventListener('DOMContentLoaded', () => {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
            updateThemeIconUI();
            verifyAdminAuthSession();
        });

        async function verifyAdminAuthSession() {
            try {
                const { data: { session }, error: sessionErr } = await supabase.auth.getSession();
                if (sessionErr) throw sessionErr;

                if (!session) {
                    window.location.href = "login.html";
                    return;
                }

                document.getElementById('admin-display-log').innerText = `Sync Live (${session.user.email})`;
                appendQuestionRow(); 
                loadData();
            } catch (err) {
                console.error(err);
                window.location.href = "login.html";
            }
        }

        function toggleThemeSystem() {
            document.documentElement.classList.toggle('dark');
            updateThemeIconUI();
        }

        function updateThemeIconUI() {
            const iconEl = document.getElementById('theme-toggle-icon');
            iconEl.setAttribute('data-lucide', document.documentElement.classList.contains('dark') ? 'sun' : 'moon');
            lucide.createIcons();
        }

        function adjustTextAreaHeight(element) {
            element.style.height = 'auto';
            element.style.height = element.scrollHeight + 'px';
        }

        function toggleRowType(rowId) {
            const row = document.getElementById(`row-${rowId}`);
            const entryType = row.querySelector('.r-entry-type').value;
            const qaFields = row.querySelector('.r-qa-fields');
            const driveFields = row.querySelector('.r-drive-fields');

            if (entryType === 'qa') {
                qaFields.classList.remove('hidden');
                driveFields.classList.add('hidden');
            } else {
                qaFields.classList.add('hidden');
                driveFields.classList.remove('hidden');
            }
        }

        function appendQuestionRow() {
            rowCount++;
            const container = document.getElementById('bulk-container');
            const row = document.createElement('div');
            const currentId = rowCount;
            row.id = `row-${currentId}`;
            row.className = "q-row bg-slate-50 dark:bg-slate-950/60 border border-slate-200/60 dark:border-white/5 p-4 md:p-5 rounded-2xl relative grid grid-cols-1 md:grid-cols-12 gap-4 items-start shadow-xs transition hover:border-slate-300 dark:hover:border-white/10";
            
            row.innerHTML = `
                <button type="button" onclick="this.parentElement.remove()" class="absolute top-3 right-3 text-slate-400 hover:text-rose-500 hover:scale-110 transition duration-150"><i data-lucide="x" class="w-5 h-5"></i></button>
                
                <div class="md:col-span-3 space-y-3 pt-3">
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-slate-400 dark:text-slate-500 mb-1">Entry Type</label>
                        <select onchange="toggleRowType(${currentId})" class="r-entry-type w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
                            <option value="qa" selected>Question & Answer</option>
                            <option value="drive">Drive Resource</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] uppercase font-bold text-slate-400 dark:text-slate-500 mb-1">Marks</label>
                            <input type="number" value="2" class="r-marks w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500" placeholder="Marks">
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase font-bold text-slate-400 dark:text-slate-500 mb-1">Difficulty</label>
                            <select class="r-diff w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-white/10 rounded-xl px-2 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
                                <option>Easy</option>
                                <option selected>Medium</option>
                                <option>Hard</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="md:col-span-9 space-y-3">
                    <!-- Q&A Fields -->
                    <div class="r-qa-fields space-y-3">
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
                            <div class="md:col-span-1">
                                <label class="block text-[10px] uppercase font-bold text-slate-400 dark:text-slate-500 mb-1">Answer Format</label>
                                <select class="r-format w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
                                    <option value="points">Points List</option>
                                    <option value="passage">Passage Text</option>
                                </select>
                            </div>
                            <div class="md:col-span-3">
                                <label class="block text-[10px] uppercase font-bold text-slate-400 dark:text-slate-500 mb-1">Question Statement</label>
                                <textarea oninput="adjustTextAreaHeight(this)" class="auto-resize r-question w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 leading-relaxed" placeholder="Question statement..."></textarea>
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase font-bold text-slate-400 dark:text-slate-500 mb-1">Answer Criteria (New lines map to array points if format is Points)</label>
                            <textarea oninput="adjustTextAreaHeight(this)" class="auto-resize r-answer w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-white/10 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 leading-relaxed" placeholder="Answer content..."></textarea>
                        </div>
                    </div>

                    <!-- Drive Fields -->
                    <div class="r-drive-fields space-y-3 hidden">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[10px] uppercase font-bold text-slate-400 dark:text-slate-500 mb-1">Title</label>
                                <input type="text" class="r-title w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500" placeholder="e.g., Chapter 1 Notes PDF">
                            </div>
                            <div>
                                <label class="block text-[10px] uppercase font-bold text-slate-400 dark:text-slate-500 mb-1">Subtitle</label>
                                <input type="text" class="r-subtitle w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500" placeholder="e.g., Supplementary reading material">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase font-bold text-slate-400 dark:text-slate-500 mb-1">Google Drive URL</label>
                            <input type="url" class="r-drive-url w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500" placeholder="https://drive.google.com/...">
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(row);
            lucide.createIcons();
        }

        async function submitBulkData(status) {
            const subject = document.getElementById('global-subject').value.trim();
            const topic = document.getElementById('global-topic').value.trim();
            if(!subject || !topic) return alert("Define ingestion namespace configurations (Subject and Topic).");

            const rows = document.querySelectorAll('.q-row');
            if(!rows.length) return;

            const payload = Array.from(rows).map(row => {
                const entryType = row.querySelector('.r-entry-type').value;
                const marks = parseInt(row.querySelector('.r-marks').value) || 2;
                const difficulty = row.querySelector('.r-diff').value;

                if (entryType === 'qa') {
                    const format = row.querySelector('.r-format').value;
                    const rawAnswer = row.querySelector('.r-answer').value;
                    return {
                        subject_name: subject,
                        topic_name: topic,
                        entry_type: 'qa',
                        marks_weightage: marks,
                        difficulty_level: difficulty,
                        question_text: row.querySelector('.r-question').value.trim(),
                        answer_format: format,
                        answer_points: format === 'points' ? rawAnswer.split('\n').map(p=>p.trim()).filter(Boolean) : null,
                        answer_passage: format === 'passage' ? rawAnswer.trim() : null,
                        title: null,
                        subtitle: null,
                        drive_url: null,
                        status: status
                    };
                } else {
                    return {
                        subject_name: subject,
                        topic_name: topic,
                        entry_type: 'drive',
                        marks_weightage: marks,
                        difficulty_level: difficulty,
                        title: row.querySelector('.r-title').value.trim(),
                        subtitle: row.querySelector('.r-subtitle').value.trim(),
                        drive_url: row.querySelector('.r-drive-url').value.trim(),
                        question_text: null,
                        answer_format: null,
                        answer_points: null,
                        answer_passage: null,
                        status: status
                    };
                }
            });

            const { error } = await supabase.from('question_bank').insert(payload);
            if (!error) {
                document.getElementById('bulk-container').innerHTML = '';
                appendQuestionRow();
                loadData();
            } else {
                alert("Database insertion failed: " + error.message);
            }
        }

        async function updateDashboardMetrics(data) {
            document.getElementById('stat-total').innerText = data.length;
            document.getElementById('stat-published').innerText = data.filter(q => q.status === 'Published').length;
            document.getElementById('stat-draft').innerText = data.filter(q => q.status === 'Draft').length;
            
            const uniqueSubjects = [...new Set(data.map(q => q.subject_name))].length;
            document.getElementById('stat-subjects').innerText = uniqueSubjects;
        }

        async function loadData() {
            const container = document.getElementById('repository-container');
            const filter = document.getElementById('search-filter').value.trim();
            
            let query = supabase.from('question_bank').select('*').order('created_at', { ascending: false });
            if (filter) query = query.or(`subject_name.ilike.%${filter}%,topic_name.ilike.%${filter}%,question_text.ilike.%${filter}%,title.ilike.%${filter}%`);
            
            const { data, error } = await query;
            if (error) return;

            cachedData = data;
            updateDashboardMetrics(data);

            if (!data.length) {
                container.innerHTML = `<div class="text-center text-slate-400 py-12 font-medium text-sm tracking-wide bg-white dark:bg-slate-900 border border-slate-100 dark:border-white/5 rounded-2xl">Empty System Registry Vault.</div>`;
                return;
            }

            const grouped = data.reduce((acc, curr) => {
                if (!acc[curr.subject_name]) acc[curr.subject_name] = {};
                if (!acc[curr.subject_name][curr.topic_name]) acc[curr.subject_name][curr.topic_name] = [];
                acc[curr.subject_name][curr.topic_name].push(curr);
                return acc;
            }, {});

            renderAdminGroupedUI(grouped, container);
        }

        function renderAdminGroupedUI(groupedData, container) {
            let html = "";
            for (const [subject, topics] of Object.entries(groupedData)) {
                html += `
                <div class="bg-slate-50 dark:bg-slate-950/40 border-l-4 border-indigo-500 border border-slate-200/60 dark:border-white/5 rounded-2xl p-5 md:p-6 shadow-xs">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 pb-3 border-b border-slate-200/60 dark:border-white/5 gap-3">
                        <h2 class="text-base font-bold text-slate-800 dark:text-white flex items-center tracking-tight">
                            <i data-lucide="folder-archive" class="w-5 h-5 mr-2 text-indigo-500"></i> ${subject}
                        </h2>
                        <div class="flex items-center space-x-2">
                            <button onclick="batchModifyStatus('${subject}', 'Published')" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-emerald-50 text-emerald-600 border border-emerald-200 hover:bg-emerald-100 dark:bg-emerald-950/30 dark:text-emerald-400 dark:border-emerald-900/40 transition">PUBLISH ALL</button>
                            <button onclick="batchModifyStatus('${subject}', 'Draft')" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-amber-50 text-amber-600 border border-amber-200 hover:bg-amber-100 dark:bg-amber-950/30 dark:text-amber-400 dark:border-amber-900/40 transition">DRAFT ALL</button>
                            <button onclick="batchDeleteSubject('${subject}')" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100 transition">DELETE ALL</button>
                        </div>
                    </div>
                    <div class="space-y-4">`;

                for (const [topic, questions] of Object.entries(topics)) {
                    html += `
                        <div class="bg-white dark:bg-slate-900 border border-slate-100 dark:border-white/5 rounded-2xl p-4 md:p-5 shadow-xs">
                            <h3 class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-3 flex items-center"><i data-lucide="layers" class="w-4 h-4 mr-1.5 text-slate-400"></i> ${topic}</h3>
                            <div class="space-y-3">`;

                    questions.forEach(q => {
                        const isPub = q.status === 'Published';
                        const currentStatusText = isPub ? 'PUBLISH' : 'DRAFT';
                        const isDrive = q.entry_type === 'drive';

                        html += `
                            <div class="flex flex-col sm:flex-row items-start justify-between p-4 rounded-xl border border-slate-100 dark:border-white/5 bg-slate-50/60 dark:bg-slate-950/30 gap-4 hover:border-slate-200 dark:hover:border-white/10 transition">
                                <div class="w-full sm:w-[88%] space-y-2">
                                    <div class="flex flex-wrap items-center gap-2">
                                        <button onclick="toggleSingleStatus(${q.id}, '${q.status}')" class="text-[10px] font-bold px-2.5 py-1 rounded-lg border uppercase transition-all tracking-wide ${isPub ? 'bg-emerald-500 text-white border-emerald-600 shadow-xs' : 'bg-amber-500 text-white border-amber-600 shadow-xs'}">
                                            ${currentStatusText} ⇄
                                        </button>
                                        <span class="text-[10px] font-semibold px-2.5 py-1 rounded-lg border border-slate-200 dark:border-white/10 text-slate-500 dark:text-slate-400 uppercase tracking-wider bg-white dark:bg-slate-900">${q.entry_type}</span>
                                        <span class="text-[10px] font-semibold px-2.5 py-1 rounded-lg border border-slate-200 dark:border-white/10 text-slate-500 dark:text-slate-400 uppercase tracking-wider bg-white dark:bg-slate-900">${q.difficulty_level}</span>
                                        <span class="text-[10px] font-mono font-bold px-2.5 py-1 rounded-lg border border-slate-200 dark:border-white/10 text-slate-600 dark:text-slate-400 bg-white dark:bg-slate-900">${q.marks_weightage}M</span>
                                    </div>
                                    
                                    ${isDrive ? `
                                        <div class="space-y-1">
                                            <p class="text-sm font-bold text-slate-800 dark:text-white leading-relaxed break-words">${q.title || 'Untitled Resource'}</p>
                                            ${q.subtitle ? `<p class="text-xs text-slate-500 dark:text-slate-400">${q.subtitle}</p>` : ''}
                                            ${q.drive_url ? `<a href="${q.drive_url}" target="_blank" class="inline-flex items-center text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline mt-1"><i data-lucide="external-link" class="w-3.5 h-3.5 mr-1"></i> Open Drive Resource</a>` : ''}
                                        </div>
                                    ` : `
                                        <p class="text-sm font-bold text-slate-800 dark:text-white leading-relaxed break-words">Q: ${q.question_text || 'No Question Text'}</p>
                                        <div class="text-sm text-slate-600 dark:text-slate-400 bg-white dark:bg-slate-900/60 py-1.5 px-3 rounded-xl border border-slate-100 dark:border-white/5 whitespace-pre-wrap break-words leading-relaxed shadow-2xs h-auto min-h-0">
                                            ${q.answer_format === 'points' && Array.isArray(q.answer_points) ? `<ul class="list-disc pl-5 space-y-0.5">${q.answer_points.map(p=>`<li>${p}</li>`).join('')}</ul>` : (q.answer_passage || '')}
                                        </div>
                                    `}
                                </div>
                                
                                <div class="flex sm:flex-col gap-2 shrink-0 self-end sm:self-start pt-1">
                                    <button onclick="openEditModal(${q.id})" class="inline-flex items-center justify-center font-bold text-xs text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 px-3 py-2 rounded-xl transition shadow-2xs" title="EDIT Configuration">EDIT</button>
                                    <button onclick="deleteQuestion(${q.id})" class="inline-flex items-center justify-center font-bold text-xs text-rose-600 bg-rose-50 hover:bg-rose-100 px-3 py-2 rounded-xl transition border border-rose-100" title="DELETE Entry">DELETE</button>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                }
                html += `</div></div>`;
            }
            container.innerHTML = html;
            lucide.createIcons();
        }

        async function batchModifyStatus(subjectName, targetStatus) {
            const { error } = await supabase.from('question_bank').update({ status: targetStatus }).eq('subject_name', subjectName);
            if (!error) loadData();
        }

        async function toggleSingleStatus(id, currentStatus) {
            const target = currentStatus === 'Published' ? 'Draft' : 'Published';
            const { error } = await supabase.from('question_bank').update({ status: target }).eq('id', id);
            if (!error) loadData();
        }

        async function batchDeleteSubject(subjectName) {
            if (confirm(`ADMIN WARNING: Completely wipe all records attached to "${subjectName}"?`)) {
                const { error } = await supabase.from('question_bank').delete().eq('subject_name', subjectName);
                if (!error) loadData();
            }
        }

        function openEditModal(id) {
            const q = cachedData.find(item => item.id === id);
            if (!q) return;

            document.getElementById('edit-id').value = q.id;
            document.getElementById('edit-entry-type').value = q.entry_type;
            document.getElementById('modal-id-badge').innerText = `ID: ${q.id} (${q.entry_type})`;
            
            document.getElementById('edit-marks').value = q.marks_weightage;
            document.getElementById('edit-difficulty').value = q.difficulty_level;
            document.getElementById('edit-status').value = q.status;

            const qaContainer = document.getElementById('edit-qa-container');
            const driveContainer = document.getElementById('edit-drive-container');

            if (q.entry_type === 'qa') {
                qaContainer.classList.remove('hidden');
                driveContainer.classList.add('hidden');

                const qInput = document.getElementById('edit-question');
                qInput.value = q.question_text || '';
                
                document.getElementById('edit-format').value = q.answer_format || 'passage';
                
                const aInput = document.getElementById('edit-answer');
                aInput.value = q.answer_format === 'points' && Array.isArray(q.answer_points) ? q.answer_points.join('\n') : (q.answer_passage || '');

                setTimeout(() => {
                    adjustTextAreaHeight(qInput);
                    adjustTextAreaHeight(aInput);
                }, 20);
            } else {
                qaContainer.classList.add('hidden');
                driveContainer.classList.remove('hidden');

                document.getElementById('edit-title').value = q.title || '';
                document.getElementById('edit-subtitle').value = q.subtitle || '';
                document.getElementById('edit-drive-url').value = q.drive_url || '';
            }

            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeEditModal() { document.getElementById('edit-modal').style.display = 'none'; }

        async function saveUpdatedQuestion() {
            const id = document.getElementById('edit-id').value;
            const entryType = document.getElementById('edit-entry-type').value;

            let payload = {
                marks_weightage: parseInt(document.getElementById('edit-marks').value) || 2,
                difficulty_level: document.getElementById('edit-difficulty').value,
                status: document.getElementById('edit-status').value
            };

            if (entryType === 'qa') {
                const format = document.getElementById('edit-format').value;
                const rawAns = document.getElementById('edit-answer').value;

                payload.question_text = document.getElementById('edit-question').value.trim();
                payload.answer_format = format;
                payload.answer_points = format === 'points' ? rawAns.split('\n').map(p=>p.trim()).filter(Boolean) : null;
                payload.answer_passage = format === 'passage' ? rawAns.trim() : null;
            } else {
                payload.title = document.getElementById('edit-title').value.trim();
                payload.subtitle = document.getElementById('edit-subtitle').value.trim();
                payload.drive_url = document.getElementById('edit-drive-url').value.trim();
            }

            const { error } = await supabase.from('question_bank').update(payload).eq('id', id);
            if(!error) { closeEditModal(); loadData(); }
            else { alert("Failed to save changes: " + error.message); }
        }

        async function deleteQuestion(id) {
            if(confirm("Permanently destroy registry document record?")) {
                const { error } = await supabase.from('question_bank').delete().eq('id', id);
                if(!error) loadData();
            }
        }

        async function purgeEmptyRegisters() {
            loadData();
        }
    </script>
</body>
</html>
