<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PAGE_TITLE}} | KKDGMS</title>
    <link rel="icon" type="image/x-icon" href="../kk.png">
    
    <!-- Professional Theme System -->
    <link rel="stylesheet" href="../assets/css/theme.css">
    
    <!-- Enterprise Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Modern Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- KKDGMS Common Configuration -->
    <script src="../assets/js/supabase-config.js"></script>
    
    <!-- Page-Specific Styles -->
    <style>
        /* Custom page styles can be added here */
        .sidebar-transition { 
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        
        .submenu-hidden { 
            max-height: 0; 
            opacity: 0; 
            overflow: hidden; 
            transition: max-height 0.25s cubic-bezier(0, 1, 0, 1), opacity 0.2s ease-out; 
        }
        
        .submenu-visible { 
            max-height: 300px; 
            opacity: 1; 
            transition: max-height 0.3s ease-in-out, opacity 0.25s ease-in; 
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col lg:flex-row selection:bg-indigo-500 selection:text-white">

    <!-- Enterprise Sidebar Navigation -->
    <aside id="sidebar-nav" class="fixed inset-y-0 left-0 w-72 bg-white text-slate-700 z-50 sidebar-transition -translate-x-full lg:translate-x-0 border-r border-slate-200/80 flex flex-col justify-between shadow-md" aria-label="Sidebar Navigation">
        <div class="flex flex-col h-full overflow-hidden">
            
            <!-- Workspace Brand Header -->
            <div class="h-16 px-6 border-b border-slate-100 flex justify-between items-center flex-shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-md shadow-indigo-200">
                        <i data-lucide="shield-check" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <span class="font-bold text-sm text-slate-900 tracking-tight block leading-tight">KKDGMS Portal</span>
                        <span class="text-[10px] font-medium text-slate-400 uppercase tracking-wider block">{{ROLE_LABEL}}</span>
                    </div>
                </div>
                <button onclick="toggleSidebarMenu()" class="lg:hidden p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition" aria-label="Close Navigation Menu">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Navigation Scroll Area -->
            <nav class="flex-1 p-4 space-y-1 overflow-y-auto text-xs font-semibold">
                <div class="px-3 py-2 text-[10px] font-bold uppercase tracking-wider text-slate-400">{{SECTION_LABEL_1}}</div>
                
                {{NAVIGATION_ITEMS}}
                
                <div class="px-3 pt-3 pb-1 text-[10px] font-bold uppercase tracking-wider text-slate-400">{{SECTION_LABEL_2}}</div>
                
                {{SECONDARY_NAV_ITEMS}}
            </nav>

            <!-- Sidebar Footer Action -->
            <div class="p-4 border-t border-slate-100 flex-shrink-0">
                <button onclick="AuthManager.logout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-rose-50/80 hover:bg-rose-600 text-rose-600 hover:text-white text-xs font-bold tracking-wide rounded-xl transition-all border border-rose-100 hover:border-transparent cursor-pointer">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    <span>LOGOUT</span>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content Workspace Navigation -->
    <div class="flex-1 lg:pl-72 min-h-screen flex flex-col transition-all duration-300">
        
        <!-- Mobile Top Header Bar -->
        <header class="lg:hidden sticky top-0 z-30 glass border-b border-slate-200/80 p-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebarMenu()" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-700 transition cursor-pointer" aria-label="Open Navigation Drawer">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <span class="text-xs font-bold uppercase tracking-wider text-slate-800">{{MOBILE_HEADER_LABEL}}</span>
            </div>
            <div class="w-8 h-8 rounded-full bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600 font-bold text-xs">
                {{USER_INITIALS}}
            </div>
        </header>

        <!-- Main Dashboard Workspace -->
        <main class="p-4 sm:p-6 md:p-8 max-w-7xl mx-auto w-full space-y-6">
            
            <!-- Page Header -->
            <header class="bg-white border border-slate-200/80 rounded-2xl p-6 shadow-sm flex flex-col md:flex-row items-center md:items-start gap-6 relative overflow-hidden">
                <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-indigo-500 via-purple-500 to-indigo-600"></div>
                
                <!-- Profile Avatar -->
                <div class="relative flex-shrink-0">
                    <img id="user-avatar-img" src="../teacher1.jpg" alt="User Profile Avatar" class="w-20 h-20 rounded-2xl object-cover border-2 border-slate-100 shadow-md bg-slate-50">
                    <span class="absolute -bottom-1 -right-1 bg-emerald-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs ring-4 ring-white font-bold shadow-sm">
                        <i data-lucide="check" class="w-3 h-3 stroke-[3]"></i>
                    </span>
                </div>
                
                <!-- User Information -->
                <div class="flex-1 text-center md:text-left space-y-2 w-full">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h1 id="user-fullname-lbl" class="text-xl md:text-2xl font-extrabold text-slate-900 tracking-tight">Loading Profile...</h1>
                            <span id="user-title-lbl" class="inline-flex items-center gap-1.5 bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full border border-indigo-100/80 mt-1">
                                <span class="w-1.5 h-1.5 rounded-full bg-indigo-600 animate-pulse"></span>
                                <span id="user-status-text">Verifying credentials...</span>
                            </span>
                        </div>
                        
                        <!-- System Identity Badge -->
                        <div class="bg-slate-50 border border-slate-200/60 p-3 rounded-xl text-xs font-mono text-center md:text-right min-w-[180px] shadow-sm">
                            <div class="text-slate-500 flex justify-between md:justify-end gap-2">
                                <span class="text-slate-400">User ID:</span>
                                <span id="user-uid-lbl" class="text-slate-900 font-bold">—</span>
                            </div>
                            <div class="text-slate-500 flex justify-between md:justify-end gap-2 mt-1">
                                <span class="text-slate-400">Role:</span>
                                <span id="user-role-lbl" class="text-emerald-600 font-bold uppercase tracking-wider">—</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Contact Information -->
                    <div class="flex flex-wrap justify-center md:justify-start gap-3 text-xs text-slate-600 font-medium">
                        <div class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-100">
                            <i data-lucide="mail" class="w-4 h-4 text-indigo-500"></i>
                            <span id="user-email-lbl" class="text-slate-800 font-semibold">—</span>
                        </div>
                        <div class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-100">
                            <i data-lucide="phone" class="w-4 h-4 text-indigo-500"></i>
                            <span id="user-phone-lbl" class="text-slate-800 font-semibold">—</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main Content Area -->
            <div id="main-content" class="space-y-6">
                {{PAGE_CONTENT}}
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Page-Specific Scripts -->
    <script>
        // Sidebar Toggle Function
        function toggleSidebarMenu() {
            const sidebar = document.getElementById('sidebar-nav');
            sidebar.classList.toggle('-translate-x-full');
        }
        
        // Initialize Lucide Icons
        document.addEventListener('DOMContentLoaded', function() {
            if (window.lucide) {
                lucide.createIcons();
            }
            
            // Load user profile
            loadUserProfile();
        });
        
        // Load User Profile (Override in page-specific scripts)
        async function loadUserProfile() {
            try {
                const session = await AuthManager.getCurrentSession();
                if (!session) {
                    window.location.href = '../login.html';
                    return;
                }
                
                // Page-specific profile loading should be implemented
                // This is a placeholder for common functionality
                document.getElementById('user-fullname-lbl').textContent = 'User Name';
                document.getElementById('user-status-text').textContent = 'Profile Loaded';
                
            } catch (error) {
                ErrorHandler.handle(error, 'Profile Load');
                window.location.href = '../login.html';
            }
        }
    </script>
    
    <!-- Page-Specific Script -->
    <script src="{{PAGE_SCRIPT}}"></script>
</body>
</html>
