<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="KKDGMS - Hostel Leave Approvals">
  <meta name="theme-color" content="#1e40af">
  <title>Hostel Leave Approvals — KKDGMS</title>
  
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Poppins', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
              400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
              800: '#1e40af', 900: '#1e3a8a', 950: '#172554'
            },
            accent: {
              500: '#f59e0b', 600: '#d97706', 700: '#b45309'
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col md:flex-row antialiased">
  
  <aside id="sidebar-container" class="w-64 flex-shrink-0 z-30"></aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <header id="navbar-container" class="sticky top-0 z-20"></header>

    <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto space-y-6">
      
    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700 mb-6">
      <h1 class="text-2xl font-bold font-display text-gray-900 dark:text-white">Hostel Leave & Outpass Approvals</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Verify parent confirmation and issue campus exit authorization</p>
    </div>
    <div id="leavesContainer" class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700 p-6"></div>
  
    </main>

    <div id="notification-panel-container"></div>
  </div>

  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>
  <div id="modalContainer"></div>

  <script type="module">
    import config from '../js/config.js';
    import supabaseService from '../js/services/supabase.service.js';
    import authService from '../js/services/auth.service.js';
    import permissionService from '../js/services/permission.service.js';
    import uiService from '../js/services/ui.service.js';
    import Sidebar from '../components/sidebar.js';
    import Navbar from '../components/navbar.js';
    import DataTable from '../components/data-table.js';
    import { formatDate } from '../js/utils/date.utils.js';

    const userRole = 'WARDEN';
    const activePage = 'warden/leave-approval.html';

    document.addEventListener('DOMContentLoaded', async () => {
      const savedTheme = localStorage.getItem('kkdgms-theme') || 'system';
      const isDark = savedTheme === 'dark' || (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', isDark);

      const sidebarMount = document.getElementById('sidebar-container');
      const navbarMount = document.getElementById('navbar-container');
      
      if (sidebarMount) {
        new Sidebar({
          container: sidebarMount,
          role: userRole,
          currentPage: activePage
        }).render();
      }

      if (navbarMount) {
        new Navbar({
          container: navbarMount,
          title: 'Hostel Leave Approvals',
          breadcrumbs: [
            { label: 'Portal', href: '#' },
            { label: 'Hostel Leave Approvals', active: true }
          ]
        }).render();
      }

      if (window.lucide) lucide.createIcons();

      
    const container = document.getElementById('leavesContainer');
    const { data } = await supabaseService.from('student_leaves').select('*');
    new DataTable({
      container,
      columns: [
        { key: 'from_date', label: 'Dates', render: (r) => formatDate(r.from_date) + ' to ' + formatDate(r.to_date) },
        { key: 'reason', label: 'Reason' },
        { key: 'parent_approval', label: 'Parent Approved', render: (r) => r.parent_approval ? '<span class="badge badge-success">Yes</span>' : '<span class="badge badge-warning">Pending</span>' },
        { key: 'status', label: 'Status', render: (r) => '<span class="badge badge-info">' + r.status + '</span>' }
      ],
      data: data || []
    }).render();
  
    });
  </script>
</body>
</html>
