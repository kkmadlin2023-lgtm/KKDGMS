<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | KKDGMS Admin</title>
    <link rel="icon" type="image/x-icon" href="kk.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
            color: #f8fafc;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .editable-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            width: 100%;
        }
        .editable-input:disabled {
            background: transparent;
            border-color: transparent;
            color: #cbd5e1;
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- HEADER -->
        <header class="glass-card p-6 rounded-3xl flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-black tracking-tight text-white flex items-center gap-3">
                    <i data-lucide="users" class="w-7 h-7 text-indigo-400"></i>
                    Master User Directory
                </h1>
                <p class="text-xs text-slate-400 mt-1">Manage user roles, email addresses, and security credentials across tables.</p>
            </div>
            <a href="a_dashboard.html" class="flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl transition-all">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Dashboard
            </a>
        </header>

        <!-- FILTERS & SEARCH -->
        <div class="glass-card p-4 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="relative w-full sm:w-80">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" onkeyup="filterUsers()" placeholder="Search by name or email..." class="w-full pl-9 pr-4 py-2 bg-slate-900 border border-white/10 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <select id="roleFilter" onchange="filterUsers()" class="bg-slate-900 border border-white/10 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-indigo-500 w-full sm:w-auto">
                    <option value="ALL">All Roles</option>
                    <option value="students">Students</option>
                    <option value="admins">Admins</option>
                    <option value="faculty_details">Faculty</option>
                    <option value="wardens">Wardens</option>
                </select>
                <button onclick="loadAllUsers()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl flex items-center gap-2 transition-all shrink-0">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh
                </button>
            </div>
        </div>

        <!-- USERS TABLE -->
        <div class="glass-card rounded-3xl overflow-hidden border border-white/10">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900/80 text-[11px] uppercase tracking-wider text-slate-400 border-b border-white/10">
                            <th class="p-4">Name</th>
                            <th class="p-4">Email</th>
                            <th class="p-4">Role</th>
                            <th class="p-4">New Password (Optional)</th>
                            <th class="p-4">Last Activity</th>
                            <th class="p-4 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="divide-y divide-white/5 text-xs">
                        <tr>
                            <td colspan="6" class="p-8 text-center text-slate-500 font-semibold animate-pulse">
                                Fetching user records...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Replace with your project configuration variables
       const SUPABASE_URL = 'https://kymsjrxjfmloibcbages.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5bXNqcnhqZm1sb2liY2JhZ2VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTg5NzcsImV4cCI6MjA5NDU5NDk3N30.yXqibP86VDsJ0gW48cJ0yjixgYGpljesLsiqe93K4OA';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let masterUserData = [];

        async function loadAllUsers() {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500 font-semibold animate-pulse">Loading Users...</td></tr>`;

            try {
                const [students, admins, faculty, wardens] = await Promise.all([
                    _supabase.from('students').select('*'),
                    _supabase.from('admins').select('*'),
                    _supabase.from('faculty_details').select('*'),
                    _supabase.from('wardens').select('*')
                ]);

                masterUserData = [
                    ...(students.data || []).map(u => ({ ...u, currentTable: 'students' })),
                    ...(admins.data || []).map(u => ({ ...u, currentTable: 'admins' })),
                    ...(faculty.data || []).map(u => ({ ...u, currentTable: 'faculty_details' })),
                    ...(wardens.data || []).map(u => ({ ...u, currentTable: 'wardens' }))
                ];

                renderTable(masterUserData);
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-rose-500 font-bold">Failed to load users: ${err.message}</td></tr>`;
            }
        }

        function renderTable(users) {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';

            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500">No users found.</td></tr>`;
                return;
            }

            users.forEach((user, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-white/5 transition-colors";
                
                const displayName = user.name || user.full_name || user.student_name || user.faculty_name || 'N/A';
                const emailVal = user.email || 'N/A';
                const lastLoginVal = user.last_login ? new Date(user.last_login).toLocaleString() : (user.fcm_updated_at ? new Date(user.fcm_updated_at).toLocaleString() : 'N/A');

                tr.innerHTML = `
                    <td class="p-4 font-bold text-slate-300">
                        ${displayName}
                    </td>
                    <td class="p-4">
                        <input type="email" id="email-${index}" class="editable-input font-mono text-indigo-300" value="${emailVal}" disabled>
                    </td>
                    <td class="p-4">
                        <select id="role-${index}" class="bg-slate-900 border border-white/10 rounded-lg px-2 py-1 text-xs text-amber-300 focus:outline-none" disabled>
                            <option value="students" ${user.currentTable === 'students' ? 'selected' : ''}>Student</option>
                            <option value="admins" ${user.currentTable === 'admins' ? 'selected' : ''}>Admin</option>
                            <option value="faculty_details" ${user.currentTable === 'faculty_details' ? 'selected' : ''}>Faculty</option>
                            <option value="wardens" ${user.currentTable === 'wardens' ? 'selected' : ''}>Warden</option>
                        </select>
                    </td>
                    <td class="p-4">
                        <input type="password" id="pass-${index}" placeholder="••••••••" class="editable-input font-mono text-emerald-400" disabled>
                    </td>
                    <td class="p-4 text-slate-400 font-mono text-[11px]">
                        ${lastLoginVal}
                    </td>
                    <td class="p-4 text-center">
                        <button id="btn-edit-${index}" onclick="enableEdit(${index})" class="px-3 py-1.5 bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 rounded-lg hover:bg-indigo-600 hover:text-white transition-all font-semibold">
                            Edit
                        </button>
                        <button id="btn-save-${index}" onclick="saveUser(${index}, '${user.currentTable}', '${user.email}', '${displayName}')" class="hidden px-3 py-1.5 bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 rounded-lg hover:bg-emerald-600 hover:text-white transition-all font-semibold">
                            Save
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            lucide.createIcons();
        }

        function enableEdit(index) {
            document.getElementById(`email-${index}`).disabled = false;
            document.getElementById(`role-${index}`).disabled = false;
            document.getElementById(`pass-${index}`).disabled = false;

            document.getElementById(`btn-edit-${index}`).classList.add('hidden');
            document.getElementById(`btn-save-${index}`).classList.remove('hidden');
        }

        async function saveUser(index, originalTable, originalEmail, displayName) {
            const newEmail = document.getElementById(`email-${index}`).value.trim().toLowerCase();
            const newRoleTable = document.getElementById(`role-${index}`).value;
            const newPass = document.getElementById(`pass-${index}`).value.trim();

            const saveBtn = document.getElementById(`btn-save-${index}`);
            saveBtn.disabled = true;
            saveBtn.innerText = "Saving...";

            try {
                const updatePayload = { email: newEmail };

                // Handle Role / Table Migration
                if (newRoleTable !== originalTable) {
                    await _supabase.from(originalTable).delete().eq('email', originalEmail);
                    await _supabase.from(newRoleTable).insert([{ ...updatePayload, name: displayName }]);
                } else {
                    const { error } = await _supabase
                        .from(originalTable)
                        .update(updatePayload)
                        .eq('email', originalEmail);

                    if (error) throw error;
                }

                alert("User updated successfully!");
                loadAllUsers();
            } catch (err) {
                alert("Error updating record: " + err.message);
                saveBtn.disabled = false;
                saveBtn.innerText = "Save";
            }
        }

        function filterUsers() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const roleFilter = document.getElementById('roleFilter').value;

            const filtered = masterUserData.filter(u => {
                const name = (u.name || u.full_name || u.student_name || u.faculty_name || '').toLowerCase();
                const email = (u.email || '').toLowerCase();
                const matchesQuery = name.includes(query) || email.includes(query);
                const matchesRole = roleFilter === 'ALL' || u.currentTable === roleFilter;

                return matchesQuery && matchesRole;
            });

            renderTable(filtered);
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadAllUsers();
        });
    </script>
</body>
</html>
