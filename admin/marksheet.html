<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marksheet | Admin - KKDGMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Placeholder -->
        <aside class="w-64 bg-gray-800 text-white flex flex-col" id="sidebar"></aside>

        <div class="flex-1 flex flex-col relative w-full">
            <!-- Navbar Placeholder -->
            <header class="h-16 bg-white shadow flex items-center justify-between px-6 z-10" id="navbar"></header>

            <!-- Main Content -->
            <main class="flex-1 overflow-y-auto p-6 bg-gray-100">
                <div class="mb-6 flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-gray-800">Marksheet Matrix</h1>
                    <button id="exportPdfBtn" class="bg-green-600 text-white px-4 py-2 rounded shadow hover:bg-green-700 flex items-center gap-2">
                        <i data-lucide="download"></i> Export PDF
                    </button>
                </div>

                <!-- Filters -->
                <div class="bg-white p-4 rounded-lg shadow mb-6 grid grid-cols-1 md:grid-cols-5 gap-4">
                    <select class="border p-2 rounded"><option>2026-2027</option></select>
                    <select class="border p-2 rounded"><option>Class 10</option></select>
                    <select class="border p-2 rounded"><option>Section A</option></select>
                    <select class="border p-2 rounded"><option>Maths</option></select>
                    <select class="border p-2 rounded"><option>Quarterly</option></select>
                </div>

                <!-- Analytics -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
                    <div class="bg-white p-4 rounded shadow">
                        <p class="text-gray-500 text-sm">Class Average</p>
                        <p class="text-2xl font-bold">78.5%</p>
                    </div>
                    <div class="bg-white p-4 rounded shadow">
                        <p class="text-gray-500 text-sm">Pass %</p>
                        <p class="text-2xl font-bold text-green-600">92%</p>
                    </div>
                    <div class="bg-white p-4 rounded shadow">
                        <p class="text-gray-500 text-sm">Highest Marks</p>
                        <p class="text-2xl font-bold">99/100</p>
                    </div>
                    <div class="bg-white p-4 rounded shadow">
                        <p class="text-gray-500 text-sm">Lowest Marks</p>
                        <p class="text-2xl font-bold text-red-600">32/100</p>
                    </div>
                </div>

                <!-- Matrix -->
                <div class="bg-white rounded-lg shadow overflow-hidden" id="marksheetContent">
                    <div class="p-6 text-center border-b hidden" id="pdfHeader">
                        <h2 class="text-2xl font-bold">KKDGMS School</h2>
                        <p>Marksheet Report - Class 10A - Quarterly</p>
                    </div>
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Roll No</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Student Name</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Subject Marks</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Total</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Grade</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <tr>
                                <td class="px-6 py-4 text-sm text-gray-900">1001</td>
                                <td class="px-6 py-4 text-sm text-gray-900">Kavya S</td>
                                <td class="px-6 py-4 text-sm text-gray-900">85</td>
                                <td class="px-6 py-4 text-sm text-gray-900">85/100</td>
                                <td class="px-6 py-4 text-sm text-gray-900">A</td>
                                <td class="px-6 py-4 text-sm"><span class="text-green-600 font-bold">Pass</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        lucide.createIcons();
        document.getElementById('exportPdfBtn').addEventListener('click', () => {
            const element = document.getElementById('marksheetContent');
            const pdfHeader = document.getElementById('pdfHeader');
            pdfHeader.classList.remove('hidden');
            html2pdf().from(element).save('Marksheet.pdf').then(() => {
                pdfHeader.classList.add('hidden');
            });
        });
    </script>
    <script type="module">
        import { checkAuth } from '../js/services/auth.js';
        // RBAC Guard
        // checkAuth(['admin']);
    </script>
</body>
</html>
