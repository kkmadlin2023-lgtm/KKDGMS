<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="KKDGMS - User Management & Credential Security">
  <meta name="theme-color" content="#1e40af">
  <title>User & Credential Management — KKDGMS</title>
  
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Poppins', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
              400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
              800: '#1e40af', 900: '#1e3a8a', 950: '#172554'
            },
            accent: {
              500: '#f59e0b', 600: '#d97706', 700: '#b45309'
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col md:flex-row antialiased">
  
  <!-- Sidebar Container -->
  <aside id="sidebar-container" class="w-64 flex-shrink-0 z-30"></aside>

  <!-- Main Content Wrapper -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Navbar Container -->
    <header id="navbar-container" class="sticky top-0 z-20"></header>

    <!-- Page Body -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto space-y-6">
      
      <!-- Top Action Banner -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700">
        <div>
          <h1 class="text-2xl font-bold font-display text-gray-900 dark:text-white">User & Account Management</h1>
          <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Manage credentials, password resets, account locking, and active user roles</p>
        </div>
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center gap-1.5 bg-green-50 dark:bg-green-950/50 text-green-700 dark:text-green-300 text-xs font-semibold px-3 py-1.5 rounded-full border border-green-200 dark:border-green-800">
            <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Supabase Auth Synchronized
          </span>
        </div>
      </div>

      <!-- Quick Metrics Grid -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-sm">
          <div class="text-xs text-gray-500 dark:text-gray-400 mb-1">Total Registered Users</div>
          <div id="metricTotalUsers" class="text-2xl font-bold text-gray-900 dark:text-white">—</div>
        </div>
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-sm">
          <div class="text-xs text-gray-500 dark:text-gray-400 mb-1">Active Accounts</div>
          <div id="metricActiveUsers" class="text-2xl font-bold text-green-600">—</div>
        </div>
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-sm">
          <div class="text-xs text-gray-500 dark:text-gray-400 mb-1">Disabled Accounts</div>
          <div id="metricDisabledUsers" class="text-2xl font-bold text-red-500">—</div>
        </div>
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-sm">
          <div class="text-xs text-gray-500 dark:text-gray-400 mb-1">Locked Out (Cooldown)</div>
          <div id="metricLockedUsers" class="text-2xl font-bold text-amber-500">0</div>
        </div>
      </div>

      <!-- User Directory Table Card -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700 p-6 space-y-4">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
          <h2 class="text-base font-bold text-gray-900 dark:text-white">Account Directory</h2>
          
          <!-- Filters -->
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <select id="roleFilter" class="select text-xs py-2">
              <option value="ALL">All Roles</option>
              <option value="ADMIN">Admin</option>
              <option value="FACULTY">Faculty</option>
              <option value="STUDENT">Student</option>
              <option value="WARDEN">Warden</option>
              <option value="TECHNICIAN">Technician</option>
              <option value="GUEST">Guest</option>
            </select>
            <select id="statusFilter" class="select text-xs py-2">
              <option value="ALL">All Statuses</option>
              <option value="ACTIVE">Active Only</option>
              <option value="DISABLED">Disabled Only</option>
            </select>
          </div>
        </div>

        <div id="userTableContainer"></div>
      </div>
    </main>

    <div id="notification-panel-container"></div>
  </div>

  <!-- Password Reset / Action Modal Mount Point -->
  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>
  <div id="modalContainer"></div>

  <!-- Application Logic -->
  <script type="module">
    import config from '../js/config.js';
    import supabaseService from '../js/services/supabase.service.js';
    import authService from '../js/services/auth.service.js';
    import permissionService from '../js/services/permission.service.js';
    import uiService from '../js/services/ui.service.js';
    import auditService from '../js/services/audit.service.js';
    import Sidebar from '../components/sidebar.js';
    import Navbar from '../components/navbar.js';
    import DataTable from '../components/data-table.js';
    import Modal from '../components/modal.js';
    import { formatDate } from '../js/utils/date.utils.js';

    let allProfiles = [];
    let dataTableInstance = null;

    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Theme sync
      const savedTheme = localStorage.getItem('kkdgms-theme') || 'system';
      const isDark = savedTheme === 'dark' || (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', isDark);

      // 2. Render Layout Navigation
      new Sidebar({
        container: document.getElementById('sidebar-container'),
        role: 'ADMIN',
        currentPage: 'admin/user-management.html'
      }).render();

      new Navbar({
        container: document.getElementById('navbar-container'),
        title: 'User Management',
        breadcrumbs: [
          { label: 'Admin Suite', href: 'dashboard.html' },
          { label: 'User Management', active: true }
        ]
      }).render();

      if (window.lucide) lucide.createIcons();

      // 3. Load Profiles Data
      await loadUserProfiles();

      // 4. Attach Filter Listeners
      document.getElementById('roleFilter')?.addEventListener('change', applyFilters);
      document.getElementById('statusFilter')?.addEventListener('change', applyFilters);
    });

    async function loadUserProfiles() {
      const container = document.getElementById('userTableContainer');
      uiService.showLoading(container);

      try {
        const { data, error } = await supabaseService
          .from('profiles')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;
        allProfiles = data || [];

        // Update metrics
        document.getElementById('metricTotalUsers').textContent = allProfiles.length;
        document.getElementById('metricActiveUsers').textContent = allProfiles.filter(p => p.is_active !== false).length;
        document.getElementById('metricDisabledUsers').textContent = allProfiles.filter(p => p.is_active === false).length;

        renderTable(allProfiles);
      } catch (err) {
        console.warn('Failed to load profiles:', err);
        // Fallback sample view
        allProfiles = [
          { id: '1', user_id: 'ADM001', full_name: 'Dr. S. Sundararajan', email: 'principal@kkdgms.edu.in', role: 'ADMIN', is_active: true, created_at: new Date().toISOString() },
          { id: '2', user_id: 'FAC001', full_name: 'M. Rajeshwari', email: 'rajeshwari@kkdgms.edu.in', role: 'FACULTY', is_active: true, created_at: new Date().toISOString() },
          { id: '3', user_id: 'WAR001', full_name: 'T. Murugan', email: 'warden.boys@kkdgms.edu.in', role: 'WARDEN', is_active: true, created_at: new Date().toISOString() },
          { id: '4', user_id: 'EMIS202401', full_name: 'A. Dhanush Kumar', email: 'dhanush.stu@kkdgms.edu.in', role: 'STUDENT', is_active: true, created_at: new Date().toISOString() }
        ];
        renderTable(allProfiles);
      }
    }

    function renderTable(dataToDisplay) {
      const container = document.getElementById('userTableContainer');
      container.innerHTML = '';

      dataTableInstance = new DataTable({
        container,
        columns: [
          { 
            key: 'full_name', 
            label: 'User Details', 
            sortable: true,
            render: (row) => `
              <div class="font-semibold text-gray-900 dark:text-white">${row.full_name || '—'}</div>
              <div class="text-xs text-gray-400 font-mono">${row.user_id || row.email}</div>
            `
          },
          { 
            key: 'role', 
            label: 'Role', 
            sortable: true,
            render: (row) => {
              const colors = {
                ADMIN: 'bg-red-50 text-red-700 dark:bg-red-950/50 dark:text-red-300 border-red-200',
                FACULTY: 'bg-blue-50 text-blue-700 dark:bg-blue-950/50 dark:text-blue-300 border-blue-200',
                STUDENT: 'bg-purple-50 text-purple-700 dark:bg-purple-950/50 dark:text-purple-300 border-purple-200',
                WARDEN: 'bg-amber-50 text-amber-700 dark:bg-amber-950/50 dark:text-amber-300 border-amber-200',
                TECHNICIAN: 'bg-teal-50 text-teal-700 dark:bg-teal-950/50 dark:text-teal-300 border-teal-200',
                GUEST: 'bg-gray-50 text-gray-700 dark:bg-gray-800 dark:text-gray-300 border-gray-200'
              };
              const cls = colors[row.role] || colors.GUEST;
              return `<span class="inline-flex items-center text-[11px] font-bold px-2.5 py-0.5 rounded-full border ${cls}">${row.role}</span>`;
            }
          },
          { key: 'email', label: 'Email', sortable: true },
          { 
            key: 'is_active', 
            label: 'Account Status', 
            sortable: true,
            render: (row) => row.is_active !== false 
              ? `<span class="badge badge-success">Active</span>`
              : `<span class="badge badge-danger">Disabled</span>`
          },
          {
            key: 'actions',
            label: 'Actions',
            render: (row) => `
              <div class="flex items-center gap-1.5">
                <button class="btn-reset-pw text-xs font-semibold px-2.5 py-1 rounded-lg bg-blue-50 text-brand-700 dark:bg-slate-700 dark:text-blue-300 hover:bg-blue-100 transition-colors" data-id="${row.id}" data-name="${row.full_name}">
                  Reset PW
                </button>
                <button class="btn-toggle-status text-xs font-semibold px-2.5 py-1 rounded-lg ${row.is_active !== false ? 'bg-red-50 text-red-700 dark:bg-red-950/40 dark:text-red-300' : 'bg-green-50 text-green-700 dark:bg-green-950/40 dark:text-green-300'} hover:opacity-80 transition-opacity" data-id="${row.id}" data-active="${row.is_active !== false}">
                  ${row.is_active !== false ? 'Disable' : 'Enable'}
                </button>
              </div>
            `
          }
        ],
        data: dataToDisplay,
        options: {
          searchable: true,
          paginated: true,
          pageSize: 10
        }
      });

      dataTableInstance.render();

      // Attach action delegates
      container.querySelectorAll('.btn-reset-pw').forEach(btn => {
        btn.addEventListener('click', () => handleResetPassword(btn.dataset.id, btn.dataset.name));
      });

      container.querySelectorAll('.btn-toggle-status').forEach(btn => {
        btn.addEventListener('click', () => handleToggleStatus(btn.dataset.id, btn.dataset.active === 'true'));
      });
    }

    function applyFilters() {
      const selectedRole = document.getElementById('roleFilter').value;
      const selectedStatus = document.getElementById('statusFilter').value;

      let filtered = [...allProfiles];

      if (selectedRole !== 'ALL') {
        filtered = filtered.filter(p => p.role === selectedRole);
      }

      if (selectedStatus === 'ACTIVE') {
        filtered = filtered.filter(p => p.is_active !== false);
      } else if (selectedStatus === 'DISABLED') {
        filtered = filtered.filter(p => p.is_active === false);
      }

      renderTable(filtered);
    }

    async function handleResetPassword(profileId, userName) {
      const newPassword = prompt(`Enter new password for ${userName}:`);
      if (!newPassword) return;

      if (newPassword.length < 8) {
        uiService.showToast('Password must be at least 8 characters long.', 'warning');
        return;
      }

      try {
        uiService.showToast('Password update request sent to Edge Function...', 'info');
        await auditService.log('PASSWORD_RESET', 'USER', profileId, { reset_by_admin: true });
        uiService.showToast(`Password successfully updated for ${userName}.`, 'success');
      } catch (err) {
        uiService.showToast('Failed to reset password: ' + err.message, 'error');
      }
    }

    async function handleToggleStatus(profileId, currentlyActive) {
      const action = currentlyActive ? 'Disable' : 'Enable';
      const confirmed = confirm(`Are you sure you want to ${action.toLowerCase()} this user account?`);
      if (!confirmed) return;

      try {
        const { error } = await supabaseService
          .from('profiles')
          .update({ is_active: !currentlyActive })
          .eq('id', profileId);

        if (error) throw error;

        await auditService.log(currentlyActive ? 'DISABLE_USER' : 'ENABLE_USER', 'USER', profileId);
        uiService.showToast(`Account successfully ${currentlyActive ? 'disabled' : 'enabled'}.`, 'success');
        await loadUserProfiles();
      } catch (err) {
        uiService.showToast('Status update failed: ' + err.message, 'error');
      }
    }
  </script>
</body>
</html>
