<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Allocation | Admin - KKDGMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Placeholder -->
        <aside class="w-64 bg-gray-800 text-white flex flex-col" id="sidebar"></aside>

        <div class="flex-1 flex flex-col relative w-full">
            <!-- Navbar Placeholder -->
            <header class="h-16 bg-white shadow flex items-center justify-between px-6 z-10" id="navbar"></header>

            <!-- Main Content -->
            <main class="flex-1 overflow-y-auto p-6 bg-gray-100">
                <div class="mb-6 flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-gray-800">Faculty Allocation</h1>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Faculty List -->
                    <div class="bg-white rounded-lg shadow lg:col-span-1">
                        <div class="p-4 border-b">
                            <input type="text" placeholder="Search faculty..." class="w-full border p-2 rounded">
                        </div>
                        <ul class="divide-y overflow-y-auto h-96">
                            <li class="p-4 hover:bg-gray-50 cursor-pointer flex items-center gap-3">
                                <div class="w-10 h-10 bg-gray-200 rounded-full flex-shrink-0"></div>
                                <div>
                                    <h4 class="font-bold text-sm">Mr. Ramesh Kumar</h4>
                                    <p class="text-xs text-gray-500">Mathematics Dept.</p>
                                </div>
                            </li>
                        </ul>
                    </div>

                    <!-- Allocation Panel -->
                    <div class="bg-white rounded-lg shadow p-6 lg:col-span-2">
                        <h2 class="text-lg font-bold mb-4">Allocate Faculty: Mr. Ramesh Kumar</h2>
                        
                        <div class="mb-6 p-4 bg-blue-50 rounded border border-blue-100">
                            <h3 class="font-bold mb-2">Current Assignments</h3>
                            <ul class="text-sm list-disc list-inside text-gray-700">
                                <li>Class 10A - Mathematics (Class Teacher)</li>
                                <li>Class 9B - Mathematics</li>
                            </ul>
                        </div>

                        <form class="space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Class</label>
                                    <select class="mt-1 w-full border p-2 rounded"><option>Class 8</option></select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Section</label>
                                    <select class="mt-1 w-full border p-2 rounded"><option>A</option></select>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Subject</label>
                                <select class="mt-1 w-full border p-2 rounded"><option>Mathematics</option></select>
                            </div>
                            <div class="flex items-center gap-2 mt-4">
                                <input type="checkbox" id="classTeacher" class="rounded">
                                <label for="classTeacher" class="text-sm font-medium text-gray-700">Assign as Class Teacher</label>
                            </div>
                            <button type="button" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Allocate</button>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        lucide.createIcons();
    </script>
    <script type="module">
        import { checkAuth } from '../js/services/auth.js';
        // checkAuth(['admin']);
    </script>
</body>
</html>
