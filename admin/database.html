<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Explorer - KKDGMS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body class="bg-[var(--bg)] text-[var(--text)] min-h-screen flex flex-col font-sans">
    
    <main class="flex-grow container mx-auto px-4 py-8 max-w-7xl">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-[var(--primary)]">Database Explorer</h1>
                <p class="text-[var(--text-secondary)]">Safely view and edit entity records</p>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <!-- Sidebar -->
            <div class="md:col-span-1 bg-[var(--surface)] rounded-xl border border-[var(--border)] p-4 h-[calc(100vh-180px)] overflow-y-auto">
                <h3 class="text-xs font-semibold text-[var(--text-secondary)] uppercase tracking-wider mb-4">Tables</h3>
                <ul class="space-y-1">
                    <li><button class="w-full text-left px-3 py-2 bg-[var(--primary-light)] text-[var(--primary)] rounded-lg font-medium flex items-center"><i data-lucide="table" class="w-4 h-4 mr-2"></i> users</button></li>
                    <li><button class="w-full text-left px-3 py-2 hover:bg-[var(--bg)] rounded-lg text-[var(--text-secondary)] flex items-center"><i data-lucide="table" class="w-4 h-4 mr-2"></i> students</button></li>
                    <li><button class="w-full text-left px-3 py-2 hover:bg-[var(--bg)] rounded-lg text-[var(--text-secondary)] flex items-center"><i data-lucide="table" class="w-4 h-4 mr-2"></i> faculty</button></li>
                    <li><button class="w-full text-left px-3 py-2 hover:bg-[var(--bg)] rounded-lg text-[var(--text-secondary)] flex items-center"><i data-lucide="table" class="w-4 h-4 mr-2"></i> attendance</button></li>
                    <li><button class="w-full text-left px-3 py-2 hover:bg-[var(--bg)] rounded-lg text-[var(--text-secondary)] flex items-center"><i data-lucide="table" class="w-4 h-4 mr-2"></i> marks</button></li>
                    <li><button class="w-full text-left px-3 py-2 hover:bg-[var(--bg)] rounded-lg text-[var(--text-secondary)] flex items-center"><i data-lucide="table" class="w-4 h-4 mr-2"></i> exams</button></li>
                    <li><button class="w-full text-left px-3 py-2 hover:bg-[var(--bg)] rounded-lg text-[var(--text-secondary)] flex items-center"><i data-lucide="table" class="w-4 h-4 mr-2"></i> events</button></li>
                </ul>
            </div>

            <!-- Content Area -->
            <div class="md:col-span-3 bg-[var(--surface)] rounded-xl border border-[var(--border)] flex flex-col h-[calc(100vh-180px)]">
                <div class="p-4 border-b border-[var(--border)] flex justify-between items-center bg-[var(--bg)] rounded-t-xl">
                    <h2 class="font-semibold flex items-center">
                        <i data-lucide="database" class="w-4 h-4 mr-2 text-[var(--primary)]"></i>
                        Table: users
                    </h2>
                    <div class="flex gap-2">
                        <input type="text" placeholder="Filter..." class="px-3 py-1 text-sm rounded border border-[var(--border)] bg-[var(--surface)] focus:outline-none">
                        <button class="px-3 py-1 bg-[var(--primary)] text-white text-sm rounded hover:bg-blue-600">Add Record</button>
                    </div>
                </div>
                
                <div class="flex-grow overflow-auto">
                    <table class="w-full text-left border-collapse min-w-[600px]">
                        <thead class="sticky top-0 bg-[var(--surface)] z-10 shadow-sm">
                            <tr class="border-b border-[var(--border)] text-[var(--text-secondary)] text-sm">
                                <th class="py-2 px-4 font-medium">id</th>
                                <th class="py-2 px-4 font-medium">email</th>
                                <th class="py-2 px-4 font-medium">role</th>
                                <th class="py-2 px-4 font-medium">created_at</th>
                                <th class="py-2 px-4 font-medium text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="text-sm">
                            <tr class="border-b border-[var(--border)] hover:bg-[var(--bg)]">
                                <td class="py-2 px-4 font-mono text-xs">d3b07384...</td>
                                <td class="py-2 px-4">admin@kkdgms.edu</td>
                                <td class="py-2 px-4"><span class="bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-400 px-2 py-0.5 rounded text-xs">ADMIN</span></td>
                                <td class="py-2 px-4 text-[var(--text-secondary)]">2026-01-10</td>
                                <td class="py-2 px-4 text-right">
                                    <button class="text-[var(--primary)] hover:underline mr-2">Edit</button>
                                    <button class="text-[var(--danger)] hover:underline">Delete</button>
                                </td>
                            </tr>
                            <tr class="border-b border-[var(--border)] hover:bg-[var(--bg)]">
                                <td class="py-2 px-4 font-mono text-xs">f8a92120...</td>
                                <td class="py-2 px-4">faculty1@kkdgms.edu</td>
                                <td class="py-2 px-4"><span class="bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400 px-2 py-0.5 rounded text-xs">FACULTY</span></td>
                                <td class="py-2 px-4 text-[var(--text-secondary)]">2026-02-15</td>
                                <td class="py-2 px-4 text-right">
                                    <button class="text-[var(--primary)] hover:underline mr-2">Edit</button>
                                    <button class="text-[var(--danger)] hover:underline">Delete</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="p-3 border-t border-[var(--border)] text-xs text-[var(--text-secondary)] text-center bg-[var(--bg)] rounded-b-xl">
                    Showing 2 of 2 records
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        lucide.createIcons();
    </script>
</body>
</html>
