<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Management | Admin - KKDGMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Placeholder -->
        <aside class="w-64 bg-gray-800 text-white flex flex-col" id="sidebar"></aside>

        <div class="flex-1 flex flex-col relative w-full">
            <!-- Navbar Placeholder -->
            <header class="h-16 bg-white shadow flex items-center justify-between px-6 z-10" id="navbar"></header>

            <!-- Main Content -->
            <main class="flex-1 overflow-y-auto p-6 bg-gray-100">
                <div class="mb-6 flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-gray-800">Leave Console</h1>
                </div>

                <!-- Filters -->
                <div class="bg-white p-4 rounded-lg shadow mb-6 flex flex-wrap gap-4">
                    <select id="roleFilter" class="border p-2 rounded">
                        <option value="">All Roles</option>
                        <option value="student">Student</option>
                        <option value="faculty">Faculty</option>
                        <option value="warden">Warden</option>
                        <option value="technician">Technician</option>
                    </select>
                    <select id="statusFilter" class="border p-2 rounded">
                        <option value="">All Statuses</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                    </select>
                    <input type="date" id="dateFilter" class="border p-2 rounded">
                    <input type="text" id="classFilter" placeholder="Class/Sec (e.g. 10-A)" class="border p-2 rounded">
                    <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Filter</button>
                </div>

                <!-- Leave List -->
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name/Role</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Duration</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Reason</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200" id="leaveTableBody">
                            <!-- Rows will be populated by JS -->
                            <tr>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="text-sm font-medium text-gray-900">Arun Kumar</div>
                                    <div class="text-sm text-gray-500">Student - 10A</div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">2026-09-24 to 2026-09-25</td>
                                <td class="px-6 py-4 text-sm text-gray-500">Fever</td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">Pending</span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                    <button class="text-green-600 hover:text-green-900 mr-2">Approve</button>
                                    <button class="text-red-600 hover:text-red-900">Reject</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        lucide.createIcons();
    </script>
    <script type="module">
        import { checkAuth } from '../js/services/auth.js';
        // RBAC Guard
        // checkAuth(['admin']);
        
        // Setup Components
        import Sidebar from '../components/Sidebar.js';
        import Navbar from '../components/Navbar.js';
        
        document.getElementById('sidebar').innerHTML = Sidebar('admin');
        document.getElementById('navbar').innerHTML = Navbar();
    </script>
</body>
</html>
