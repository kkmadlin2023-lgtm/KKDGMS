<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Exams | Admin - KKDGMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Placeholder -->
        <aside class="w-64 bg-gray-800 text-white flex flex-col" id="sidebar"></aside>

        <div class="flex-1 flex flex-col relative w-full">
            <!-- Navbar Placeholder -->
            <header class="h-16 bg-white shadow flex items-center justify-between px-6 z-10" id="navbar"></header>

            <!-- Main Content -->
            <main class="flex-1 overflow-y-auto p-6 bg-gray-100">
                <div class="mb-6 flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-gray-800">Online Exams</h1>
                    <button class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 flex items-center gap-2">
                        <i data-lucide="plus"></i> Create Exam
                    </button>
                </div>

                <!-- Exam List -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Exam Card -->
                    <div class="bg-white rounded-lg shadow p-6 border-t-4 border-green-500">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-lg font-bold">Physics Mid-Term</h3>
                                <p class="text-sm text-gray-500">Class 11 - Science</p>
                            </div>
                            <span class="px-2 py-1 bg-green-100 text-green-800 text-xs rounded-full font-bold">Active</span>
                        </div>
                        <div class="space-y-2 text-sm text-gray-700">
                            <p><strong>Attempts:</strong> 45/50 students</p>
                            <p><strong>Avg Score:</strong> 72%</p>
                            <p><strong>Avg Duration:</strong> 42 mins</p>
                            <p><strong>Q-Accuracy:</strong> 68%</p>
                        </div>
                        <div class="mt-4 pt-4 border-t border-gray-100">
                            <button class="text-blue-600 hover:underline text-sm font-medium">View Details & Live Scores &rarr;</button>
                        </div>
                    </div>
                    
                    <!-- Exam Card Upcoming -->
                    <div class="bg-white rounded-lg shadow p-6 border-t-4 border-yellow-500">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-lg font-bold">Math Quiz 1</h3>
                                <p class="text-sm text-gray-500">Class 9 - All Sections</p>
                            </div>
                            <span class="px-2 py-1 bg-yellow-100 text-yellow-800 text-xs rounded-full font-bold">Upcoming</span>
                        </div>
                        <div class="space-y-2 text-sm text-gray-700">
                            <p><strong>Scheduled:</strong> 25 Sep 2026, 10:00 AM</p>
                            <p><strong>Duration:</strong> 30 mins</p>
                            <p><strong>Questions:</strong> 20</p>
                        </div>
                        <div class="mt-4 pt-4 border-t border-gray-100">
                            <button class="text-blue-600 hover:underline text-sm font-medium">Edit Exam &rarr;</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        lucide.createIcons();
    </script>
    <script type="module">
        import { checkAuth } from '../js/services/auth.js';
        // checkAuth(['admin']);
    </script>
</body>
</html>
