<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="KKDGMS - Faculty Leave Application">
  <meta name="theme-color" content="#1e40af">
  <title>Faculty Leave Application — KKDGMS</title>
  
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Poppins', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
              400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
              800: '#1e40af', 900: '#1e3a8a', 950: '#172554'
            },
            accent: {
              500: '#f59e0b', 600: '#d97706', 700: '#b45309'
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col md:flex-row antialiased">
  
  <aside id="sidebar-container" class="w-64 flex-shrink-0 z-30"></aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <header id="navbar-container" class="sticky top-0 z-20"></header>

    <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto space-y-6">
      
    <div class="grid lg:grid-cols-3 gap-6">
      <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-sm space-y-4">
        <h2 class="text-lg font-bold">Apply for Leave</h2>
        <div>
          <label class="label">From Date</label>
          <input type="date" id="leaveFrom" class="input w-full">
        </div>
        <div>
          <label class="label">To Date</label>
          <input type="date" id="leaveTo" class="input w-full">
        </div>
        <div>
          <label class="label">Reason for Leave</label>
          <textarea id="leaveReason" class="textarea w-full" rows="3"></textarea>
        </div>
        <button class="btn btn-primary w-full" onclick="alert('Leave request forwarded to Principal / Admin for approval')">Submit Leave Application</button>
      </div>
      <div class="lg:col-span-2 bg-white dark:bg-slate-800 p-6 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-sm" id="leaveHistoryContainer">
        <h2 class="text-lg font-bold mb-4">My Leave History</h2>
      </div>
    </div>
  
    </main>

    <div id="notification-panel-container"></div>
  </div>

  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>
  <div id="modalContainer"></div>

  <script type="module">
    import config from '../js/config.js';
    import supabaseService from '../js/services/supabase.service.js';
    import authService from '../js/services/auth.service.js';
    import permissionService from '../js/services/permission.service.js';
    import uiService from '../js/services/ui.service.js';
    import auditService from '../js/services/audit.service.js';
    import offlineService from '../js/services/offline.service.js';
    import validationService from '../js/services/validation.service.js';
    import Sidebar from '../components/sidebar.js';
    import Navbar from '../components/navbar.js';
    import ProfileMenu from '../components/profile-menu.js';
    import NotificationPanel from '../components/notification-panel.js';
    import DataTable from '../components/data-table.js';
    import Modal from '../components/modal.js';
    import ChartComponent from '../components/chart.js';
    import FileUpload from '../components/file-upload.js';
    import StoryViewer from '../components/story-viewer.js';
    import { formatDate, calculateAge } from '../js/utils/date.utils.js';
    import { exportToCSV, exportToPDF } from '../js/utils/export.utils.js';

    const userRole = 'FACULTY';
    const activePage = 'faculty/my-leave.html';

    document.addEventListener('DOMContentLoaded', async () => {
      const savedTheme = localStorage.getItem('kkdgms-theme') || 'system';
      const isDark = savedTheme === 'dark' || (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', isDark);

      const sidebarMount = document.getElementById('sidebar-container');
      const navbarMount = document.getElementById('navbar-container');
      
      if (sidebarMount) {
        new Sidebar({
          container: sidebarMount,
          role: userRole,
          currentPage: activePage
        }).render();
      }

      if (navbarMount) {
        new Navbar({
          container: navbarMount,
          title: 'Faculty Leave Application',
          breadcrumbs: [
            { label: 'Faculty Hub', href: 'dashboard.html' },
            { label: 'Faculty Leave Application', active: true }
          ]
        }).render();
      }

      if (window.lucide) lucide.createIcons();

      
    const container = document.getElementById('leaveHistoryContainer');
    container.innerHTML += '<p class="text-sm text-gray-500">No active pending leave applications.</p>';
  
    });
  </script>
</body>
</html>
