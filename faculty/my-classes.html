<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Classes - Faculty Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[var(--bg)] text-[var(--text)] flex h-screen overflow-hidden">
    <div id="sidebar-container"></div>
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="navbar-container"></div>
        <main class="flex-1 overflow-y-auto p-4 md:p-6">
            <h1 class="text-2xl font-bold mb-6">My Classes</h1>
            
            <div class="flex gap-4 mb-6">
                <select class="p-2 border border-[var(--border)] rounded bg-[var(--surface)]">
                    <option>Class 10</option>
                    <option>Class 9</option>
                </select>
                <select class="p-2 border border-[var(--border)] rounded bg-[var(--surface)]">
                    <option>Section A</option>
                    <option>Section B</option>
                </select>
                <button class="px-4 py-2 bg-[var(--primary)] text-white rounded hover:bg-blue-700">View Roster</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Student Card -->
                <div class="bg-[var(--surface)] p-4 rounded-lg shadow-sm border border-[var(--border)] flex gap-4">
                    <img src="https://ui-avatars.com/api/?name=Arun+Kumar" alt="Arun" class="w-16 h-16 rounded-full">
                    <div>
                        <h3 class="font-bold">Arun Kumar</h3>
                        <p class="text-sm text-[var(--text-secondary)]">Roll: 101 | Blood: O+</p>
                        <p class="text-sm text-[var(--text-secondary)]">Attendance: 92%</p>
                        <div class="mt-2 flex gap-2">
                            <a href="tel:+919876543210" class="text-xs text-[var(--primary)] flex items-center gap-1 hover:underline">
                                <i data-lucide="phone" class="w-3 h-3"></i> Parent
                            </a>
                        </div>
                    </div>
                </div>
                <!-- Student Card 2 -->
                <div class="bg-[var(--surface)] p-4 rounded-lg shadow-sm border border-[var(--border)] flex gap-4">
                    <img src="https://ui-avatars.com/api/?name=Priya+Sharma" alt="Priya" class="w-16 h-16 rounded-full">
                    <div>
                        <h3 class="font-bold">Priya Sharma</h3>
                        <p class="text-sm text-[var(--text-secondary)]">Roll: 102 | Blood: B+</p>
                        <p class="text-sm text-[var(--text-secondary)]">Attendance: 85%</p>
                        <div class="mt-2 flex gap-2">
                            <a href="tel:+919876543211" class="text-xs text-[var(--primary)] flex items-center gap-1 hover:underline">
                                <i data-lucide="phone" class="w-3 h-3"></i> Parent
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="../components/sidebar.js"></script>
    <script type="module" src="../components/navbar.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
