<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance - Faculty Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[var(--bg)] text-[var(--text)] flex h-screen overflow-hidden">
    <div id="sidebar-container"></div>
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div id="navbar-container"></div>
        <main class="flex-1 overflow-y-auto p-4 md:p-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold">Mark Attendance</h1>
                <div class="flex items-center gap-2 text-sm">
                    <span id="save-status" class="text-[var(--text-secondary)]"><i data-lucide="cloud-off" class="w-4 h-4 inline"></i> Offline</span>
                </div>
            </div>

            <div class="bg-[var(--surface)] p-4 rounded-lg shadow-sm border border-[var(--border)] mb-6 flex flex-wrap gap-4 items-end">
                <div>
                    <label class="block text-sm mb-1">Class</label>
                    <select class="p-2 border border-[var(--border)] rounded bg-[var(--bg)] min-w-[150px]">
                        <option>10 A</option>
                        <option>9 B</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm mb-1">Date</label>
                    <input type="date" class="p-2 border border-[var(--border)] rounded bg-[var(--bg)]" id="att-date">
                </div>
                <button class="px-4 py-2 bg-[var(--primary)] text-white rounded hover:bg-blue-700 ml-auto">Load List</button>
            </div>

            <div class="bg-[var(--surface)] p-4 rounded-lg shadow-sm border border-[var(--border)]">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold">Student List</h3>
                    <button class="text-sm px-3 py-1 bg-[var(--success)] text-white rounded" onclick="markAll('P')">Mark All Present</button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-[var(--border)] text-[var(--text-secondary)]">
                                <th class="p-2">Roll No</th>
                                <th class="p-2">Name</th>
                                <th class="p-2">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="border-b border-[var(--border)] hover:bg-[var(--bg)]">
                                <td class="p-2">101</td>
                                <td class="p-2">Arun Kumar</td>
                                <td class="p-2">
                                    <select class="p-1 border border-[var(--border)] rounded bg-[var(--bg)] att-select">
                                        <option value="P">Present</option>
                                        <option value="A">Absent</option>
                                        <option value="L">Leave</option>
                                    </select>
                                </td>
                            </tr>
                            <tr class="border-b border-[var(--border)] hover:bg-[var(--bg)]">
                                <td class="p-2">102</td>
                                <td class="p-2">Priya Sharma</td>
                                <td class="p-2">
                                    <select class="p-1 border border-[var(--border)] rounded bg-[var(--bg)] att-select">
                                        <option value="P">Present</option>
                                        <option value="A">Absent</option>
                                        <option value="L">Leave</option>
                                    </select>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="mt-4 flex justify-end">
                    <button class="px-6 py-2 bg-[var(--primary)] text-white rounded" onclick="saveDraft()">Save Attendance</button>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="../components/sidebar.js"></script>
    <script type="module" src="../components/navbar.js"></script>
    <script>
        lucide.createIcons();
        document.getElementById('att-date').valueAsDate = new Date();
        
        function markAll(status) {
            document.querySelectorAll('.att-select').forEach(sel => sel.value = status);
        }
        function saveDraft() {
            const statusEl = document.getElementById('save-status');
            statusEl.innerHTML = '<i data-lucide="loader" class="w-4 h-4 inline animate-spin"></i> Saving...';
            lucide.createIcons();
            setTimeout(() => {
                statusEl.innerHTML = '<i data-lucide="check" class="w-4 h-4 inline text-green-500"></i> Saved Draft';
                lucide.createIcons();
            }, 1000);
        }
    </script>
</body>
</html>
