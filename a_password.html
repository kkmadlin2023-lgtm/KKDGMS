<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Updates | KKDGMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: url('kanyakumari.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(10, 12, 22, 0.45);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .glass-card {
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 1px 0px rgba(255, 255, 255, 0.03);
        }

        /* 3D Cinematic Scale-Down Animation Matrix */
        @keyframes cinematicScaleDown {
            0% { 
                transform: scale(2.8) rotateX(-25deg) rotateY(30deg) rotateZ(-10deg) translateY(-20px); 
                opacity: 0; 
                filter: blur(12px) brightness(1.8);
            }
            45% {
                opacity: 1;
                filter: blur(0px) brightness(1.2);
            }
            100% { 
                transform: scale(1) rotateX(12deg) rotateY(-14deg) rotateZ(4deg) translateY(0); 
                opacity: 1;
                filter: drop-shadow(-12px 16px 28px rgba(0, 0, 0, 0.6)) 
                       drop-shadow(0px 8px 20px rgba(99, 102, 241, 0.25));
            }
        }

        .animate-3d-badge {
            perspective: 1500px;
            transform-style: preserve-3d;
            animation: cinematicScaleDown 1.4s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 text-white text-xs select-none">

    <div class="glass-panel p-8 rounded-2xl w-full max-w-sm relative overflow-hidden">
        <!-- Ambient Background Glow Elements -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-500/10 blur-[80px] rounded-full pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-emerald-500/5 blur-[80px] rounded-full pointer-events-none"></div>
        
        <!-- Console Brand Header -->
        <div class="text-center mb-6 relative z-10">
            <h1 class="text-base font-extrabold tracking-widest uppercase text-slate-100">
                KKDGMS <span class="text-indigo-400 bg-indigo-500/10 px-1.5 py-0.5 rounded ml-0.5 text-[10px] font-bold tracking-normal uppercase align-middle">SECURE</span>
            </h1>
            <p class="text-slate-400 text-[8px] uppercase tracking-[0.2em] font-medium mt-2">Direct Database Override Panel</p>
        </div>

        <!-- 3D Identity Found Animation Container -->
        <div id="verification-badge" class="hidden mb-6 flex flex-col items-center justify-center text-center py-4 relative z-10">
            <div class="animate-3d-badge mb-3">
                <img src="verified.png" alt="Identity Verified" class="w-16 h-16 object-contain">
            </div>
            <p class="text-emerald-400 font-extrabold tracking-widest uppercase text-[8px] mt-1">Target Account Confirmed</p>
            <p class="text-[7.5px] text-slate-400 uppercase tracking-wider mt-0.5">Identity Isolated inside auth.users</p>
        </div>

        <!-- PHASE 1: Target Lookup Form -->
        <form id="lookup-form" class="space-y-4 relative z-10">
            <div class="glass-card p-3 rounded-lg">
                <label class="block text-[8px] text-indigo-300 uppercase tracking-widest font-bold mb-1.5">Target Account Email</label>
                <input 
                    type="email" 
                    id="target-email" 
                    required 
                    autocomplete="off"
                    placeholder="kkmname2023@gmail.com" 
                    class="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500/50 transition-colors"
                >
            </div>
            <button 
                type="submit" 
                id="lookup-btn"
                class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] rounded font-bold transition-all uppercase tracking-wider text-[9px] shadow-lg shadow-indigo-600/10 cursor-pointer"
            >
                Search Database User
            </button>
        </form>

        <!-- PHASE 2: Direct Direct Overwrite Form (Hidden Initially) -->
        <form id="overwrite-form" class="space-y-4 hidden relative z-10">
            <div class="glass-card p-3 rounded-lg space-y-3">
                <div>
                    <label class="block text-[8px] text-indigo-300 uppercase tracking-widest font-bold mb-1.5">New System Password</label>
                    <input 
                        type="password" 
                        id="new-password" 
                        required 
                        minlength="6"
                        placeholder="••••••••" 
                        class="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-xs text-white placeholder-slate-700 focus:outline-none focus:border-indigo-500/50 transition-colors font-mono"
                    >
                </div>
                <div>
                    <label class="block text-[8px] text-indigo-300 uppercase tracking-widest font-bold mb-1.5">Confirm System Password</label>
                    <input 
                        type="password" 
                        id="confirm-password" 
                        required 
                        placeholder="••••••••" 
                        class="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-xs text-white placeholder-slate-700 focus:outline-none focus:border-indigo-500/50 transition-colors font-mono"
                    >
                </div>
            </div>
            <button 
                type="submit" 
                id="submit-btn"
                class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] rounded font-bold transition-all uppercase tracking-wider text-[9px] shadow-lg shadow-emerald-600/10 cursor-pointer"
            >
                Force Write New Password
            </button>
        </form>

        <!-- Status Message Notifications -->
        <div id="status-box" class="mt-4 text-center text-[9px] font-bold hidden p-2.5 rounded bg-black/30 border uppercase tracking-wider"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://kymsjrxjfmloibcbages.supabase.co";
        
        // PASTE YOUR PRIVATE SERVICE ROLE KEY HERE
        const SUPABASE_SERVICE_ROLE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5bXNqcnhqZm1sb2liY2JhZ2VzIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3OTAxODk3NywiZXhwIjoyMDk0NTk0OTc3fQ.yZroS9XpQWo4QkTjmhn61nqxoMVwCzzL7GY158ydOPM"; 

        // Administrative instance connection logic
        const _supabaseAdmin = supabase.createClient(SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, {
            auth: { persistSession: false }
        });

        const lookupForm = document.getElementById('lookup-form');
        const overwriteForm = document.getElementById('overwrite-form');
        const lookupBtn = document.getElementById('lookup-btn');
        const submitBtn = document.getElementById('submit-btn');
        const badge = document.getElementById('verification-badge');
        const statusBox = document.getElementById('status-box');

        let targetUserUUID = "";

        // Verification Guard: Checks active credentials to protect backend visibility
        async function verifyAdminAccess() {
            const standardClient = supabase.createClient(SUPABASE_URL, "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5bXNqcnhqZm1sb2liY2JhZ2VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTg5NzcsImV4cCI6MjA5NDU5NDk3N30.yXqibP86VDsJ0gW48cJ0yjixgYGpljesLsiqe93K4OA");
            const { data: { session } } = await standardClient.auth.getSession();
            
            if (!session) {
                window.location.href = 'login.html';
            }
        }

        function displayNotification(text, isError = false) {
            statusBox.classList.remove('hidden', 'text-rose-400', 'border-rose-500/20', 'text-emerald-400', 'border-emerald-500/20');
            statusBox.classList.add(isError ? 'text-rose-400' : 'text-emerald-400');
            statusBox.classList.add(isError ? 'border-rose-500/20' : 'border-emerald-500/20');
            statusBox.textContent = text;
        }

        // Execution 1: Scan registry via Admin API
        lookupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailInput = document.getElementById('target-email').value.trim();

            lookupBtn.disabled = true;
            lookupBtn.textContent = "Querying Database...";
            statusBox.classList.add('hidden');

            try {
                const { data: { users }, error } = await _supabaseAdmin.auth.admin.listUsers();
                if (error) throw error;

                const match = users.find(u => u.email.toLowerCase() === emailInput.toLowerCase());

                if (!match) {
                    throw new Error("Target identity matching email not found.");
                }

                targetUserUUID = match.id;
                
                // Triggers clean transition and cinematic 3D scale down animation
                badge.classList.remove('hidden');
                lookupForm.classList.add('hidden');
                overwriteForm.classList.remove('hidden');
                displayNotification("Record fetched. Allocate new security configurations.");

            } catch (err) {
                displayNotification(err.message, true);
            } finally {
                lookupBtn.disabled = false;
                lookupBtn.textContent = "Search Database User";
            }
        });

        // Execution 2: Direct push update to auth.users schema
        overwriteForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (pass !== confirm) {
                displayNotification("Mismatch: Passwords do not correlate.", true);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Overwriting Core Key...";

            try {
                const { error } = await _supabaseAdmin.auth.admin.updateUserById(
                    targetUserUUID,
                    { password: pass }
                );

                if (error) throw error;

                displayNotification("Override complete: New credentials committed.");
                
                setTimeout(() => {
                    location.reload(); 
                }, 2200);

            } catch (err) {
                displayNotification(err.message, true);
                submitBtn.disabled = false;
                submitBtn.textContent = "Force Write New Password";
            }
        });

        window.addEventListener('DOMContentLoaded', verifyAdminAccess);
    </script>
</body>
</html>
