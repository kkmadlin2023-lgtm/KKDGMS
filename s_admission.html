<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission | KKDGMS</title>
    <link rel="icon" type="image/x-icon" href="kk.png">
    <!-- Tailwind Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JavaScript SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- ========================================================= -->
<!-- KKDGMS LOADER REDIRECTOR (Place at top of <head>)          -->
<!-- ========================================================= -->
<script>
    (function() {
        const currentUrl = new URL(window.location.href);
        const pageName = currentUrl.pathname.split('/').pop() || 'index.html';

        // Prevent infinite loops if we are already on redirect.html
        if (pageName !== 'redirect.html' && !currentUrl.searchParams.has('loaded')) {
            // Encode target URL so query params (like ?leave_id=123) are preserved
            const targetUrl = encodeURIComponent(window.location.href);
            window.location.replace(`redirect.html?target=${targetUrl}`);
        }
    })();
</script>
<!-- ========================================================= -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* TRAFFIC LIGHT TOAST NOTIFICATION STYLES */
        #notification-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toast {
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            min-width: 320px;
            font-weight: 600;
            border-left: 6px solid rgba(0, 0, 0, 0.2);
        }

        .toast-green { background-color: #059669 !important; }   /* Success State */
        .toast-yellow { background-color: #d97706 !important; }  /* Warning State */
        .toast-red { background-color: #dc2626 !important; }     /* Error State */

        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast.fade-out {
            animation: slideOut 0.5s ease-in forwards;
        }

        @keyframes slideOut {
            to { transform: translateX(120%); opacity: 0; }
        }

        /* COMPONENT STATE TOGGLES */
        .step {
            display: none;
        }

        .step.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sidebar-step.active {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body class="bg-[#f9fafb] min-h-screen antialiased text-gray-900">

<div id="notification-container"></div>

<div class="flex flex-col lg:flex-row min-h-screen">
    <!-- Sidebar Left Navigation Panel -->
    <aside class="w-full lg:w-80 bg-white border-r border-gray-200 p-8 space-y-4">
        <div class="mb-10">
            <h1 class="text-2xl font-extrabold tracking-tighter">KKDGMS</h1>
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-[0.2em] leading-tight mt-1">District Govt Model School</p>
        </div>
        <nav id="sidebarNav" class="space-y-2">
            <button type="button" class="sidebar-step active w-full text-left p-4 rounded-2xl transition-all text-xs font-bold uppercase tracking-wider" data-step="0">01. Personal</button>
            <button type="button" class="sidebar-step w-full text-left p-4 rounded-2xl transition-all text-xs font-bold uppercase tracking-wider" data-step="1">02. Academic</button>
            <button type="button" class="sidebar-step w-full text-left p-4 rounded-2xl transition-all text-xs font-bold uppercase tracking-wider" data-step="2">03. Parents</button>
            <button type="button" class="sidebar-step w-full text-left p-4 rounded-2xl transition-all text-xs font-bold uppercase tracking-wider" data-step="3">04. Address</button>
            <button type="button" class="sidebar-step w-full text-left p-4 rounded-2xl transition-all text-xs font-bold uppercase tracking-wider" data-step="4">05. Medical</button>
            <button type="button" class="sidebar-step w-full text-left p-4 rounded-2xl transition-all text-xs font-bold uppercase tracking-wider" data-step="5">06. Certificates</button>
            <button type="button" class="sidebar-step w-full text-left p-4 rounded-2xl transition-all text-xs font-bold uppercase tracking-wider" data-step="6">07. Hostel</button>
            <button type="button" class="sidebar-step w-full text-left p-4 rounded-2xl transition-all text-xs font-bold uppercase tracking-wider" data-step="7">08. Finalize</button>
        </nav>
    </aside>

    <!-- Main Registration Window Workspace -->
    <main class="flex-1 p-6 md:p-12 lg:p-20">
        <div class="max-w-4xl mx-auto bg-white rounded-[2.5rem] shadow-xl shadow-gray-200/50 border border-gray-100 overflow-hidden">
            <div class="bg-black text-white p-10 flex justify-between items-center">
                <div>
                    <h2 class="text-3xl font-black uppercase italic tracking-tight">Admission Entry</h2>
                    <p class="text-gray-500 text-xs font-bold uppercase tracking-widest mt-1">Student Record Management</p>
                </div>
                <div class="text-right">
                    <span class="text-[10px] uppercase text-gray-500 font-bold block mb-1">Current Progress</span>
                    <span id="progressText" class="text-2xl font-black italic">1 / 8</span>
                </div>
            </div>

            <form id="admissionForm" class="p-10">
                <!-- STEP 0: Personal -->
                <div class="step active" data-step="0">
                    <h3 class="text-xl font-extrabold mb-8 flex items-center italic uppercase">Personal Details</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="md:col-span-2">
                            <label class="text-[10px] font-black text-gray-400 uppercase mb-2 block">Full Name *</label>
                            <input type="text" id="full_name" required class="w-full border-b-2 border-gray-100 focus:border-black outline-none py-3 uppercase font-bold text-lg">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-gray-400 uppercase mb-2 block">Date of Birth *</label>
                            <input type="date" id="dob" required class="w-full border-b-2 border-gray-100 py-3 font-bold">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-gray-400 uppercase mb-2 block">Calculated Age</label>
                            <input type="text" id="age" readonly class="w-full border-b-2 border-gray-50 bg-gray-50 py-3 px-3 rounded-lg font-bold">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-gray-400 uppercase mb-2 block">Aadhaar Number *</label>
                            <input type="text" id="aadhaar" maxlength="12" pattern="\d{12}" placeholder="[Aadhaar Redacted]" required class="w-full border-b-2 border-gray-100 py-3 font-bold tracking-widest">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-gray-400 uppercase mb-2 block">Gender *</label>
                            <select id="gender" required class="w-full border-b-2 border-gray-100 py-3 font-bold">
                                <option value="">Select</option>
                                <option>Male</option>
                                <option>Female</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-gray-400 uppercase mb-2 block">Login Email *</label>
                            <input type="email" id="email" required class="w-full border-b-2 border-gray-100 py-3 font-bold">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-gray-400 uppercase mb-2 block">System Password *</label>
                            <input type="password" id="password" minlength="8" required class="w-full border-b-2 border-gray-100 py-3 font-bold">
                        </div>
                    </div>
                </div>

                <!-- STEP 1: Academic Profile -->
                <div class="step" data-step="1">
                    <h3 class="text-xl font-extrabold mb-8 italic uppercase">Academic Profile</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <select id="student_class" required class="border-b-2 border-gray-100 py-3 font-bold"><option value="">Select Class *</option><option>9</option><option>10</option><option>11</option><option>12</option></select>
                        <select id="section" required class="border-b-2 border-gray-100 py-3 font-bold"><option value="">Select Section *</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option><option>G</option><option>H</option></select>
                        <select id="medium" required class="border-b-2 border-gray-100 py-3 font-bold"><option value="">Select Medium *</option><option>English</option><option>Tamil</option></select>
                        
                        <div>
                            <label class="text-[10px] font-black text-gray-400 uppercase block mb-1">Manual User ID *</label>
                            <input type="text" id="user_id" required placeholder="Enter Unique ID" class="w-full border-b-2 border-gray-100 py-3 font-mono font-bold uppercase tracking-widest">
                        </div>

                        <input type="text" id="prev_school" required placeholder="PREVIOUS SCHOOL NAME *" class="border-b-2 border-gray-100 py-3 font-bold uppercase md:col-span-2">
                        <input type="text" id="academic_year" required placeholder="ACADEMIC YEAR * (e.g. 2026-27)" class="border-b-2 border-gray-100 py-3 font-bold">
                        
                        <select id="student_group" class="border-b-2 border-gray-100 py-3 font-bold">
                            <option value="General">Select Group</option>
                            <option>Non-Grouping</option>
                            <option>Maths Computer Science</option>
                            <option>Bio Computer Science</option>
                            <option>Accountancy</option>
                            <option>History</option>
                        </select>
                    </div>
                </div>

                <!-- Step 2: Family Configurations -->
                <div class="step" data-step="2">
                    <h3 class="text-xl font-extrabold mb-8 italic uppercase">Family Linkage</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <input type="text" id="father_name" placeholder="FATHER'S NAME *" required class="border-b-2 border-gray-100 py-3 font-bold uppercase">
                        <input type="text" id="father_occupation" placeholder="FATHER'S OCCUPATION *" required class="border-b-2 border-gray-100 py-3 font-bold uppercase">
                        <input type="text" id="mother_name" placeholder="MOTHER NAME *" required class="border-b-2 border-gray-100 py-3 font-bold uppercase">
                        <input type="text" id="mother_occupation" placeholder="MOTHER OCCUPATION *" required class="border-b-2 border-gray-100 py-3 font-bold uppercase">
                        <input type="text" id="mobile" placeholder="PRIMARY MOBILE NUMBER *" required class="border-b-2 border-gray-100 py-3 font-bold">
                    </div>
                </div>

                <!-- Step 3: Address Form Elements -->
                <div class="step" data-step="3">
                    <h3 class="text-xl font-extrabold mb-8 italic uppercase">Residential Details</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <input type="text" id="door_no" placeholder="DOOR NUMBER" class="border-b-2 border-gray-100 py-3 font-bold">
                        <input type="text" id="street_name" placeholder="STREET NAME / AREA LOCATED *" required class="border-b-2 border-gray-100 py-3 font-bold uppercase">
                        <input type="text" id="place" placeholder="VILLAGE / CITY *" required class="border-b-2 border-gray-100 py-3 font-bold uppercase">
                        <input type="text" id="district" placeholder="DISTRICT *" required class="border-b-2 border-gray-100 py-3 font-bold uppercase">
                        <input type="text" id="state" placeholder="STATE *" required class="border-b-2 border-gray-100 py-3 font-bold uppercase">
                        <input type="text" id="pincode" placeholder="PINCODE *" required class="border-b-2 border-gray-100 py-3 font-bold">
                    </div>
                </div>

                <!-- Step 4: Medical Verification Information -->
                <div class="step" data-step="4">
                    <h3 class="text-xl font-extrabold mb-8 italic uppercase">Medical Records</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <input type="text" id="blood_group" required placeholder="BLOOD GROUP * (e.g. O+)" class="border-b-2 border-gray-100 py-3 font-bold">
                        <input type="text" id="id_mark_1" required placeholder="IDENTIFICATION MARK 1 *" class="border-b-2 border-gray-100 py-3 font-bold uppercase">
                        <input type="text" id="id_mark_2" placeholder="IDENTIFICATION MARK 2" class="border-b-2 border-gray-100 py-3 font-bold uppercase">
                        <input type="text" id="medical_issues" placeholder="CHRONIC MEDICAL ISSUES" class="border-b-2 border-gray-100 py-3 font-bold uppercase">
                    </div>
                </div>

                <!-- Step 5: Certificates Validation Credentials -->
                <div class="step" data-step="5">
                    <h3 class="text-xl font-extrabold mb-8 italic uppercase">Document Credentials</h3>
                    <div class="space-y-6">
                        <input type="text" id="birth_certificate" placeholder="BIRTH CERTIFICATE NO" class="border-b-2 border-gray-100 py-3 font-bold w-full uppercase">
                        <input type="text" id="income_certificate" placeholder="INCOME CERTIFICATE NO" class="border-b-2 border-gray-100 py-3 font-bold w-full uppercase">
                        <input type="text" id="nativity_certificate" placeholder="NATIVITY CERTIFICATE NO" class="border-b-2 border-gray-100 py-3 font-bold w-full uppercase">
                    </div>
                </div>

                <!-- Step 6: Hostel Requirements Management -->
                <div class="step" data-step="6">
                    <h3 class="text-xl font-extrabold mb-8 italic uppercase">Hostel Accommodation</h3>
                    <div class="space-y-8">
                        <input type="text" id="hostel_name" placeholder="HOSTEL NAME (IF APPLICABLE)" class="border-b-2 border-gray-100 py-3 font-bold w-full uppercase">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div>
                                <label class="text-[10px] font-black text-gray-400 uppercase block mb-1">Hostel Category</label>
                                <select id="hostel_type" class="w-full border-b-2 border-gray-100 py-3 font-bold"><option>None</option><option>Boys Hostel</option><option>Girls Hostel</option></select>
                            </div>
                            <div>
                                <label class="text-[10px] font-black text-gray-400 uppercase block mb-1">Hostel Declaration</label>
                                <select id="parent_declaration" class="w-full border-b-2 border-gray-100 py-3 font-bold"><option>Not Accepted</option><option>Yes, Accepted</option></select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Step 7: Final Photo Validation Stage -->
                <div class="step" data-step="7">
                    <h3 class="text-xl font-extrabold mb-8 italic uppercase">Photo Identification</h3>
                    <div class="border-4 border-dashed border-gray-100 rounded-[2rem] p-16 text-center hover:border-black transition-colors">
                        <input type="file" id="photo" class="hidden" accept="image/*" required>
                        <label for="photo" class="cursor-pointer group">
                            <div id="uploadIconFrame" class="bg-gray-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 group-hover:bg-black group-hover:text-white transition-all">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            </div>
                            <div id="previewContainer" class="hidden mb-6">
                                <img id="photoPreview" src="" class="w-40 h-40 rounded-3xl mx-auto object-cover border-4 border-black shadow-lg">
                            </div>
                            <p id="uploadText" class="text-gray-400 font-bold uppercase text-xs tracking-widest">Click to upload Passport Photo *</p>
                        </label>
                    </div>
                </div>

                <!-- NAVIGATION BUTTON CONTAINER CONTROL -->
                <div class="flex justify-between items-center mt-16 pt-10 border-t border-gray-100">
                    <button type="button" id="prevBtn" class="invisible text-gray-400 font-black uppercase text-xs tracking-widest px-8 py-4 hover:text-black transition">Previous</button>
                    <div class="flex gap-4">
                        <button type="button" id="nextBtn" class="bg-black text-white px-12 py-5 rounded-2xl font-black uppercase text-xs tracking-[0.2em] hover:scale-105 active:scale-95 transition-all">Next Step</button>
                        <button type="submit" id="submitBtn" class="hidden bg-[#10b981] text-white px-12 py-5 rounded-2xl font-black uppercase text-xs tracking-[0.2em] hover:bg-black transition-all">Deploy Record</button>
                    </div>
                </div>
            </form>
        </div>
    </main>
</div>

<script>
    const SUPABASE_URL = "https://kymsjrxjfmloibcbages.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5bXNqcnhqZm1sb2liY2JhZ2VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTg5NzcsImV4cCI6MjA5NDU5NDk3N30.yXqibP86VDsJ0gW48cJ0yjixgYGpljesLsiqe93K4OA";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentStep = 0;
    const steps = document.querySelectorAll(".step");
    const sidebarSteps = document.querySelectorAll(".sidebar-step");

    function showToast(message, type = 'success') {
        const container = document.getElementById('notification-container');
        const toast = document.createElement('div');
        
        let colorClass = 'toast-green';
        if (type === 'warning') colorClass = 'toast-yellow';
        if (type === 'error') colorClass = 'toast-red';
        
        toast.className = `toast ${colorClass}`;
        toast.innerText = message;
        container.appendChild(toast);
        
        setTimeout(() => { 
            toast.classList.add('fade-out'); 
            setTimeout(() => toast.remove(), 500); 
        }, 4000);
    }

    function updateForm() {
        steps.forEach((s, i) => s.classList.toggle("active", i === currentStep));
        sidebarSteps.forEach((s, i) => s.classList.toggle("active", i === currentStep));
        document.getElementById("progressText").innerText = `${currentStep + 1} / ${steps.length}`;
        document.getElementById("prevBtn").style.visibility = currentStep === 0 ? "hidden" : "visible";
        
        if (currentStep === steps.length - 1) {
            document.getElementById("nextBtn").classList.add("hidden");
            document.getElementById("submitBtn").classList.remove("hidden");
        } else {
            document.getElementById("nextBtn").classList.remove("hidden");
            document.getElementById("submitBtn").classList.add("hidden");
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById("nextBtn").addEventListener("click", () => {
        const inputs = steps[currentStep].querySelectorAll("input[required], select[required]");
        let valid = true;
        inputs.forEach(i => { 
            if(!i.checkValidity()) { 
                valid = false; 
                i.reportValidity(); 
            }
        });
        if(valid) { currentStep++; updateForm(); }
    });

    document.getElementById("prevBtn").addEventListener("click", () => { 
        if(currentStep > 0) { currentStep--; updateForm(); }
    });

    document.getElementById("dob").addEventListener("change", function() {
        if (!this.value) return;
        const age = new Date().getFullYear() - new Date(this.value).getFullYear();
        document.getElementById("age").value = age;
    });

    document.getElementById("photo").addEventListener("change", function(e) {
        const file = e.target.files[0];
        const preview = document.getElementById("photoPreview");
        const container = document.getElementById("previewContainer");
        const iconFrame = document.getElementById("uploadIconFrame");
        const uploadText = document.getElementById("uploadText");

        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                preview.src = event.target.result;
                container.classList.remove("hidden");
                iconFrame.classList.add("hidden");
                uploadText.innerText = "Photo Selected: " + file.name;
            };
            reader.readAsDataURL(file);
        }
    });

    // Main Form Submission targeting 'students'
    document.getElementById("admissionForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("submitBtn");
        const photoFile = document.getElementById("photo").files[0];
        
        btn.disabled = true;
        btn.innerText = "Creating Auth Instance...";

        try {
            if (!photoFile) {
                throw new Error("Please select a passport photo file before deploying the record.");
            }

            const userEmail = document.getElementById("email").value.trim();
            const userPassword = document.getElementById("password").value;

            // 1. Create User Authentication instance
            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email: userEmail,
                password: userPassword,
            });
            if (authError) throw authError;
            const userUid = authData.user ? authData.user.id : crypto.randomUUID();

            // 2. Stream uploaded photo into 'student-photos' bucket
            btn.innerText = "Streaming photo asset...";
            const fileExt = photoFile.name.split('.').pop();
            const pathName = `passports/student_${userUid}_${Date.now()}.${fileExt}`;

            const { error: uploadError } = await supabaseClient.storage
                .from('student-photos')
                .upload(pathName, photoFile);
            if (uploadError) throw uploadError;

            const { data: publicUrlData } = supabaseClient.storage
                .from('student-photos')
                .getPublicUrl(pathName);

            // 3. Serialize inputs directly mapping table columns
            btn.innerText = "Deploying Student Record...";
            const formData = {};
            const allInputs = e.target.querySelectorAll("input, select, textarea");
            
            allInputs.forEach(input => {
                if (input.id && input.type !== 'file' && input.id !== 'password') {
                    const value = input.value.trim();
                    formData[input.id] = (value !== "") ? value : null;
                }
            });

            // Set system parameters matching public.students columns
            formData['role'] = 'student';
            formData['auth_uid'] = userUid;
            formData['photo_url'] = publicUrlData.publicUrl;
            if (formData['age']) formData['age'] = parseInt(formData['age']);

            // 4. Fire final transaction into public.students
            const { error: dbError } = await supabaseClient.from('students').insert([formData]);
            if (dbError) throw dbError;

            showToast("Student Admission Record Deployed Successfully!", "success");
            setTimeout(() => { location.reload(); }, 1500);
        } catch (err) {
            console.error(err);
            showToast(err.message, "error");
            btn.disabled = false;
            btn.innerText = "Deploy Record";
        }
    });
</script>
</body>
</html>
