<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Center & User Directory</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --badge-bg: #334155;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h2 {
      margin-top: 0;
      color: var(--accent);
      font-size: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    label {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    input, select, textarea {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    button {
      background-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    .table-wrapper {
      overflow-x: auto;
      margin-top: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: var(--bg-primary);
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      background-color: var(--badge-bg);
      color: var(--accent);
    }

    .btn-select {
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
    }

    .status-msg {
      font-size: 0.9rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h2>Send New Notification</h2>
      <form id="notificationForm">
        <div class="form-group">
          <label for="notifTitle">Notification Title</label>
          <input type="text" id="notifTitle" required placeholder="e.g., Campus Outage Notice">
        </div>

        <div class="form-group">
          <label for="notifMessage">Message Details</label>
          <textarea id="notifMessage" rows="3" required placeholder="Write your announcement here..."></textarea>
        </div>

        <div class="form-group">
          <label for="targetGroup">Target Audience</label>
          <select id="targetGroup">
            <option value="all">All Users</option>
            <option value="students">Students Only</option>
            <option value="faculty">Faculty Only</option>
            <option value="admins">Admins Only</option>
            <option value="wardens">Wardens Only</option>
            <option value="specific">Specific User (Selected from table)</option>
          </select>
        </div>

        <div class="form-group" id="recipientGroup" style="display: none;">
          <label for="specificEmail">Target Email Address</label>
          <input type="email" id="specificEmail" placeholder="Click 'Select User' from the table below" readonly>
        </div>

        <button type="submit" id="submitBtn">Dispatch Notification</button>
      </form>
    </div>

    <div class="card">
      <h2>System Users Directory</h2>
      <p class="status-msg">
        Aggregated email records fetched from <code>students</code>, <code>faculty_details</code>, <code>admins</code>, and <code>wardens</code> tables.
      </p>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Email Address</th>
              <th>Role / Table Source</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <tr>
              <td colspan="3" class="status-msg">Initializing Supabase connection...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Config - Replace with your project credentials
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

    // Initialize Supabase Client
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener("DOMContentLoaded", () => {
      fetchAllUsers();
      setupFormListeners();
    });

    // Fetch emails across all 4 specific tables concurrently
    async function fetchAllUsers() {
      const tbody = document.getElementById("userTableBody");
      tbody.innerHTML = `<tr><td colspan="3" class="status-msg">Fetching database records...</td></tr>`;

      try {
        const [
          { data: students, error: errStudents },
          { data: faculty, error: errFaculty },
          { data: admins, error: errAdmins },
          { data: wardens, error: errWardens }
        ] = await Promise.all([
          supabase.from("students").select("email"),
          supabase.from("faculty_details").select("email"),
          supabase.from("admins").select("email"),
          supabase.from("wardens").select("email")
        ]);

        if (errStudents || errFaculty || errAdmins || errWardens) {
          throw new Error("One or more user queries failed. Verify table permissions/RLS.");
        }

        // Map and combine all user records into a single uniform structure
        const combinedUsers = [
          ...(students || []).map(u => ({ email: u.email, role: "Student" })),
          ...(faculty || []).map(u => ({ email: u.email, role: "Faculty" })),
          ...(admins || []).map(u => ({ email: u.email, role: "Admin" })),
          ...(wardens || []).map(u => ({ email: u.email, role: "Warden" }))
        ];

        renderTable(combinedUsers);
      } catch (error) {
        console.error("Supabase Query Error:", error);
        tbody.innerHTML = `<tr><td colspan="3" style="color: #ef4444;">Failed to load users: ${error.message}</td></tr>`;
      }
    }

    function renderTable(users) {
      const tbody = document.getElementById("userTableBody");
      tbody.innerHTML = "";

      if (users.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="status-msg">No user records found in database tables.</td></tr>`;
        return;
      }

      users.forEach(user => {
        if (!user.email) return; // Skip missing email values

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(user.email)}</td>
          <td><span class="badge">${user.role}</span></td>
          <td>
            <button type="button" class="btn-select" onclick="selectRecipient('${escapeHtml(user.email)}')">
              Select User
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Populate recipient email when 'Select User' is clicked
    function selectRecipient(email) {
      const targetGroupSelect = document.getElementById("targetGroup");
      const specificEmailInput = document.getElementById("specificEmail");
      const recipientGroup = document.getElementById("recipientGroup");

      targetGroupSelect.value = "specific";
      recipientGroup.style.display = "flex";
      specificEmailInput.value = email;
      
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setupFormListeners() {
      const targetGroup = document.getElementById("targetGroup");
      const recipientGroup = document.getElementById("recipientGroup");
      const form = document.getElementById("notificationForm");

      // Toggle email input field depending on selection
      targetGroup.addEventListener("change", (e) => {
        recipientGroup.style.display = e.target.value === "specific" ? "flex" : "none";
      });

      // Submit notification to Supabase database
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const title = document.getElementById("notifTitle").value.trim();
        const message = document.getElementById("notifMessage").value.trim();
        const targetRole = targetGroup.value;
        const targetEmail = targetRole === "specific" ? document.getElementById("specificEmail").value : null;

        const { error } = await supabase.from("notifications").insert([
          {
            title: title,
            message: message,
            target_role: targetRole,
            target_email: targetEmail
          }
        ]);

        if (error) {
          alert("Database error: " + error.message);
        } else {
          alert("Notification successfully recorded in database!");
          form.reset();
          recipientGroup.style.display = "none";
        }
      });
    }

    // Helper function to prevent HTML injection/XSS issues
    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
