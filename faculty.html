<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Details | KKDGMS</title>
    <link rel="icon" type="image/x-icon" href="kk.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.0/dist/umd/supabase.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- ========================================================= -->
<!-- KKDGMS LOADER REDIRECTOR (Place at top of <head>)          -->
<!-- ========================================================= -->
<script>
    (function() {
        const currentUrl = new URL(window.location.href);
        const pageName = currentUrl.pathname.split('/').pop() || 'index.html';

        // Prevent infinite loops if we are already on redirect.html
        if (pageName !== 'redirect.html' && !currentUrl.searchParams.has('loaded')) {
            // Encode target URL so query params (like ?leave_id=123) are preserved
            const targetUrl = encodeURIComponent(window.location.href);
            window.location.replace(`redirect.html?target=${targetUrl}`);
        }
    })();
</script>
<!-- ========================================================= -->
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-white border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 p-2 rounded-xl transition-colors">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                </a>
                <div>
                    <h1 id="dept-heading" class="text-md sm:text-lg font-black text-slate-900 uppercase tracking-tight">Faculty Directory</h1>
                    <p class="text-xs text-slate-400 font-semibold tracking-wider uppercase">Academic Hub Directory System</p>
                </div>
            </div>
            <a href="index.html" class="text-xs font-bold text-indigo-600 hover:text-indigo-800 flex items-center space-x-1">
                <i data-lucide="home" class="w-3.5 h-3.5"></i>
                <span class="hidden sm:inline">Back to Launch</span>
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-1 w-full space-y-8">
        <div id="faculty-cards-viewport" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-12 text-slate-400 space-y-3">
                <div class="animate-spin rounded-full h-7 w-7 border-4 border-slate-200 border-t-indigo-600 mx-auto"></div>
                <p class="text-xs font-bold uppercase tracking-widest">Compiling Rosters...</p>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-8 text-xs text-center border-t border-slate-800">
        <p class="text-slate-600 font-mono">&copy; 2026 Academic Hub System Logistics. All Rights Reserved.</p>
    </footer>

    <script>
        const SUPABASE_URL = "https://kymsjrxjfmloibcbages.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5bXNqcnhqZm1sb2liY2JhZ2VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTg5NzcsImV4cCI6MjA5NDU5NDk3N30.yXqibP86VDsJ0gW48cJ0yjixgYGpljesLsiqe93K4OA";

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            const urlParams = new URLSearchParams(window.location.search);
            const selectedDept = urlParams.get('dept');

            if (!selectedDept) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('dept-heading').innerText = `${selectedDept} Department`;

            try {
                const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                const { data, error } = await supabaseClient
                    .from('faculty_details')
                    .select('full_name, photo_url, role, email, user_id, qualification, mobile, blood_group')
                    .eq('department', selectedDept);

                if (error) throw error;

                const viewport = document.getElementById('faculty-cards-viewport');
                viewport.innerHTML = '';

                if (!data || data.length === 0) {
                    viewport.innerHTML = `<p class="col-span-full text-center text-slate-400 text-xs font-bold py-12">NO ACTIVE REGISTERED FACULTY ENTRIES DISCOVERED.</p>`;
                    return;
                }

                data.forEach(faculty => {
                    const card = document.createElement('div');
                    card.className = "bg-white border border-slate-200 rounded-2xl p-6 shadow-xs flex flex-col justify-between text-center relative overflow-hidden group hover:shadow-md hover:border-slate-300 transition-all duration-300";

                    const avatarUrl = faculty.photo_url && faculty.photo_url.trim() !== "" ? faculty.photo_url : "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=256&auto=format&fit=crop";

                    card.innerHTML = `
                        <div>
                            <div class="flex items-center justify-between text-[10px] font-mono font-bold text-slate-400 mb-4">
                                <span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded uppercase">${faculty.role || 'Faculty'}</span>
                                <span>ID: ${faculty.user_id}</span>
                            </div>

                            <div class="flex flex-col items-center justify-center space-y-3">
                                <div class="relative">
                                    <img src="${avatarUrl}" alt="${faculty.full_name}" class="w-20 h-20 rounded-full object-cover border-2 border-indigo-50 shadow-xs group-hover:scale-105 transition-all duration-300 mx-auto">
                                    <span class="absolute bottom-1 right-1 bg-emerald-500 border-2 border-white w-3.5 h-3.5 rounded-full"></span>
                                </div>
                                <div class="space-y-0.5">
                                    <h5 class="text-base font-black text-slate-900 group-hover:text-indigo-600 transition-colors tracking-tight line-clamp-1">${faculty.full_name.toUpperCase()}</h5>
                                    <p class="text-xs text-indigo-600 font-bold leading-tight">${faculty.qualification}</p>
                                </div>
                            </div>

                            <hr class="border-slate-100 my-4">

                            <!-- Professional Contact Matrix Layout Layer -->
                            <div class="flex flex-col sm:flex-row gap-3 text-xs font-semibold text-slate-600 w-full justify-center">
                                <a href="tel:${faculty.mobile}" class="flex items-center justify-center gap-2 hover:text-indigo-600 hover:border-indigo-200 transition-colors bg-slate-50 border border-slate-200/60 py-2 px-3 rounded-xl w-full sm:w-1/2" title="${faculty.mobile}">
                                    <i class="w-4 h-4 text-emerald-500" data-lucide="phone"></i>
                                    <span class="truncate">${faculty.mobile}</span>
                                </a>
                                <a href="mailto:${faculty.email}" class="flex items-center justify-center gap-2 hover:text-indigo-600 hover:border-indigo-200 transition-colors bg-slate-50 border border-slate-200/60 py-2 px-3 rounded-xl w-full sm:w-1/2" title="${faculty.email}">
                                    <i class="w-4 h-4 text-indigo-500" data-lucide="mail"></i>
                                    <span class="truncate">Email</span>
                                </a>
                            </div>
                        </div>

                        <div class="mt-5 pt-3 border-t border-slate-100 flex items-center justify-between text-[10px] font-bold tracking-wider text-slate-400 uppercase">
                            <span>Blood: <span class="text-rose-600">${faculty.blood_group || 'N/A'}</span></span>
                            <span class="text-slate-200 group-hover:text-indigo-500 transition-colors"><i data-lucide="shield-check" class="w-4 h-4"></i></span>
                        </div>
                    `;
                    viewport.appendChild(card);
                });

                lucide.createIcons();
            } catch (err) {
                document.getElementById('faculty-cards-viewport').innerHTML = `<p class="col-span-full text-center text-xs font-bold text-rose-500">Error Pulling Records: ${err.message}</p>`;
            }
        });
    </script>
</body>
</html>
